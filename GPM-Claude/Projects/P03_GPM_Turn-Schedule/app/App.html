        h += '<label class="f"><span>' + (c.type === 'tech' || c.type === 'vendor' ? 'What' : 'Note') + '</span><input type="text"' + a + fid('note') + ' placeholder="' + esc(ph) + '" value="' + esc(c.note || '') + '"></label>';
      }
      if (c.type === 'tech') h += '<label class="f"><span>Extra hours (lengthens the Tech step)</span><input type="number" min="0" step="0.5"' + a + fid('hours') + ' value="' + esc(c.hours == null ? '' : c.hours) + '"></label>';
      return '<div class="mc' + (changeComplete(c) ? '' : ' todo') + '"><button class="iconbtn mc-del" data-act="mc-del" data-ri="' + ri + '" title="Remove this change">✕</button>' + h + '</div>';
    }).join('');
    return rows + '<div><button class="btn sm" data-act="mc-add">+ Add a change</button></div>' +
      '<div id="impact">' + impactHtml(t, d) + '</div>';
  }

  function changeText(c) {
    var tl = (catBy(c.trade) || {}).label || c.trade || '', z = E.sizeOf(catBy(c.trade), c.size);
    if (c.type === 'add') return 'Add ' + tl + (z ? ' (' + z.label + ')' : '') + (c.note ? ': ' + c.note : '');
    if (c.type === 'resize') return tl + ' size → ' + (z ? z.label : '') + (c.note ? ': ' + c.note : '');
    if (c.type === 'remove') return 'Remove ' + tl + (c.note ? ': ' + c.note : '');
    if (c.type === 'tech') return 'Tech: ' + (c.note || '') + (c.hours ? ' (+' + c.hours + ' h)' : '');
    return 'Other vendor (Jason): ' + (c.note || '');
  }

  /** Live before/after from the Engine, nothing saved. */
  function impactOf(t, changes) {
    var done = (changes || []).filter(changeComplete);
    if (!done.length) return null;
    var r = E.applyChanges(t.steps, done, cat(), t.move_out_date);
    if (isBillProperty(t.property_label)) r.steps.forEach(function (s) { if (s.key === 'tech' && !s.vendorEdited && s.status === 'open') s.vendor = 'Bill'; });
    return { result: r, diff: E.diffSteps(t.steps, r.steps), rrBefore: t.rent_ready_date, rrAfter: r.rentReady, changes: done };
  }

  function bizText(a, b) {
    var n = E.bizDiff(a, b);
    return n === 0 ? 'no change' : Math.abs(n) + ' business day' + (Math.abs(n) === 1 ? '' : 's') + (n > 0 ? ' later' : ' earlier');
  }

  function impactHtml(t, d) {
    if (!t.move_out_date) return '<div class="imp muted">Set a move-out date to see the impact.</div>';
    var im = impactOf(t, d.changes);
    if (!im) return '<div class="imp muted">Add a change to see its effect on the schedule.</div>';
    var before = {}; t.steps.forEach(function (s) { before[s.key] = s; });
    var after = {}; im.result.steps.forEach(function (s) { after[s.key] = s; });
    var rowsHtml = im.result.steps.concat(t.steps.filter(function (s) { return !after[s.key]; })) // new order, then removed
      .map(function (s) {
        var b = before[s.key], n = after[s.key];
        var when = function (x) { return x ? E.fmt(x.start) + (x.days > 1 ? '–' + E.fmt(x.end).replace(/^\w+ /, '') : '') : ''; };
        var tag = !b ? '<em class="new">new</em>' : !n ? '<em class="gone">removed</em>' : (b.start !== n.start || b.end !== n.end) ? '<em class="mv">moved</em>' : '';
        var conf = b && (b.status === 'booked' || b.status === 'resched') && tag && !/new/.test(tag);
        return '<div class="imp-row' + (conf ? ' conf' : '') + '"><span class="dot" style="background:' + color(s.key) + '"></span><b>' + esc(s.label) + '</b>' + tag +
          '<span class="imp-d">' + (b ? esc(when(b)) : '—') + ' → ' + (n ? '<b>' + esc(when(n)) + '</b>' : '—') + '</span>' +
          (conf ? '<span class="imp-c">Confirmed with ' + esc(b.vendor || 'vendor') + ': re-contact</span>' : '') + '</div>';
      }).join('');
    var bufA = E.buffer(im.rrAfter, t.move_in_date);
    var confirmed = im.diff.moved.concat(im.diff.removed).filter(function (x) { return x.was_confirmed; });
    return '<div class="imp"><div class="imp-h">Preview (not saved yet)</div>' +
      '<div class="imp-rr">Rent ready <b>' + esc(E.fmt(im.rrBefore)) + '</b> → <b>' + esc(E.fmt(im.rrAfter)) + '</b> <span class="' + (E.bizDiff(im.rrBefore, im.rrAfter) > 0 ? 'bad' : 'ok') + '">(' + bizText(im.rrBefore, im.rrAfter) + ')</span></div>' +
      '<div class="imp-rr">Move-in buffer: ' + (!t.move_in_date ? '<span class="muted">no move-in date</span>' : bufA.ok ? '<span class="ok">✓ OK, ' + bufA.days + ' business day' + (bufA.days === 1 ? '' : 's') + ' before move-in</span>' : '<span class="bad">✕ NOT OK (' + (bufA.days === 0 ? 'same day as move-in' : -bufA.days + ' business day(s) after move-in') + ')</span>') + '</div>' +
      rowsHtml +
      (confirmed.length ? '<div class="imp-warn">' + confirmed.length + ' confirmed vendor' + (confirmed.length === 1 ? '' : 's') + ' would move: ' + esc(confirmed.map(function (x) { return x.label + ' (' + (x.vendor || 'vendor') + ')'; }).join(', ')) + '</div>'
        : '<div class="imp-ok">No confirmed vendor moves.</div>') +
      (im.result.warnings.length ? '<div class="warns" style="margin:8px 0 0">' + im.result.warnings.map(function (w) { return '<div>⚠ ' + esc(w) + '</div>'; }).join('') + '</div>' : '') +
      '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="apply-changes">Apply to schedule</button></div></div>';
  }

  function paintImpact() { var el = $('#impact'), t = cur(); if (el && t && S.form) el.innerHTML = impactHtml(t, S.form); }

  function impactSummary(t, im) {
    if (!im) return '';
    return '<div class="imp" style="margin-top:8px">Rent ready <b>' + esc(E.fmt(im.rr_before)) + '</b> → <b>' + esc(E.fmt(im.rr_after)) + '</b>' +
      (im.moved || []).map(function (m) { return '<div class="imp-row' + (m.was_confirmed ? ' conf' : '') + '"><b>' + esc(m.label) + '</b><span class="imp-d">' + esc(E.fmt(m.before)) + ' → ' + (m.after ? esc(E.fmt(m.after)) : 'removed') + '</span></div>'; }).join('') + '</div>';
  }

  function applyMoveOutChanges() {
    var t = cur(), d = S.form, im = impactOf(t, d.changes);
    if (!im) { toast('Add a complete change first.', true); return; }
    var conf = im.diff.moved.concat(im.diff.removed).filter(function (x) { return x.was_confirmed; });
    if (!confirm('Apply ' + im.changes.length + ' change' + (im.changes.length === 1 ? '' : 's') + ' to the schedule?\nRent ready ' + E.fmt(im.rrBefore) + ' → ' + E.fmt(im.rrAfter) +
      (conf.length ? '\n' + conf.length + ' confirmed vendor(s) will need to be re-contacted.' : '') + '\nThe change email goes out after.')) return;
    // Pre-Apply snapshot: saved on the turn (Edit changes works after a reload) + on the Undo stack.
    d.pre_apply = { steps: clone(t.steps), trades: clone(t.scope.trades || {}) };
    S.undo.push(JSON.stringify({ id: t.id, apply: true }));
    var moved = {}; im.diff.moved.forEach(function (m) { if (m.was_confirmed) moved[m.key] = 1; });
    im.result.steps.forEach(function (s) { if (moved[s.key] && s.status !== 'done') s.status = 'resched'; });
    t.steps = im.result.steps;
    t.scope.trades = t.scope.trades || {};
    im.changes.forEach(function (c) {
      if (c.type === 'remove' && t.scope.trades[c.trade]) t.scope.trades[c.trade].size = '';
      if (c.type === 'add' || c.type === 'resize') { var st = t.steps.filter(function (s) { return s.key === c.trade; })[0]; if (st) syncTrade(t, st); }
    });
    if (im.changes.some(function (c) { return c.type === 'tech'; }) && !t.scope.trades.tech) t.scope.trades.tech = { size: 'basic', note: '' };
    d.impact = { applied_at: new Date().toISOString(), rr_before: im.rrBefore, rr_after: im.rrAfter,
      moved: im.diff.moved.concat(im.diff.removed) };
    delete d.pending_impact; // applied now: the pending preview becomes the real impact
    S.gate = null;
    t.move_out_check = clone(d);
    S.formDirty = false; S.formKey = null;
    recompute(t);
    saveNow(t).then(function () {
      render();
      sendEmail('apiSendMoveOutEmail', t, function (r) {
        // keep the server's stamp locally, so the next save of move_out_check does not wipe it
        t.move_out_check.impact.email_sent_at = r.sentAt || new Date().toISOString();
        if (S.form && S.formKey === 'moveout:' + t.id && S.form.impact) S.form.impact.email_sent_at = t.move_out_check.impact.email_sent_at; // open form copy too, or its next save wipes it
      });
    }, function () {});
  }

  /**
   * Full undo of a move-out Apply: steps (dates, statuses, Tech hours) and trades go back to the pre-Apply
   * snapshot; the impact moves to impact_history[] (undone_at) so the email record stays. Rows unlock.
   */
  function undoApply(t) {
    var mo = t.move_out_check, pre = mo && mo.pre_apply;
    if (!pre || !mo.impact) { toast('Nothing to undo: the changes were not applied.', true); return false; }
    var before = t.rent_ready_date;
    t.steps = clone(pre.steps);
    t.scope.trades = clone(pre.trades);
    var old = clone(mo.impact); old.undone_at = new Date().toISOString();
    mo.impact_history = (mo.impact_history || []).concat([old]);
    delete mo.impact; delete mo.pre_apply;
    if (S.form && S.formKey === 'moveout:' + t.id) { // keep any other unsaved answers in the open form
      S.form.impact_history = clone(mo.impact_history); delete S.form.impact; delete S.form.pre_apply;
    }
    S.undo = S.undo.filter(function (x) { return x.indexOf('"apply":true') < 0; });
    recompute(t);
    saveNow(t).then(function () { toast('Apply undone. Schedule is back to before the move-out changes.'); render(); flashRR(before, t); }, function () {});
    render();
    return true;
  }

  // ---------- conflicted schedule ----------
  /** Who to call back: Confirmed steps whose date moved (status 'resched') + confirmed steps removed at move-out. */
  function recontacts(t) {
    var out = [], im = t.move_out_check && t.move_out_check.impact, mv = {};
    ((im && im.moved) || []).forEach(function (m, mi) { mv[m.key] = m; if (m.after === null && m.was_confirmed && !m.cleared) out.push({ cancel: true, m: m, mi: mi }); });
    t.steps.forEach(function (s, i) { if (s.status === 'resched') out.push({ s: s, i: i, m: mv[s.key] }); });
    return out;
  }

  /** Scope answered No, changes not applied to the schedule (move-out check form data). */
  function unapplied(mo) { return !!mo && mo.scope_matches === 'No' && !(mo.impact && mo.impact.applied_at); }

  function pendingBanner(t) {
    var mo = t.move_out_check;
    if (!mo || !mo.submitted_at || !unapplied(mo)) return '';
    return '<div class="conflict">⚠ Scope changed, not applied to schedule<button class="btn sm" data-act="goto-apply" data-id="' + t.id + '">Apply now</button></div>';
  }

  function conflictBanner(t, withLink) {
    var n = recontacts(t).length;
    if (!n) return '';
    return '<div class="conflict">⚠ Schedule conflicted: ' + n + ' vendor' + (n === 1 ? '' : 's') + ' to re-contact' +
      (withLink ? '<button class="btn sm" data-act="goto-recontact">See who</button>' : '') + '</div>';
  }

  function contactLine(label, val, href) {
    if (!val) return '<div class="rc-c"><span class="muted">' + label + ': not set. Add in Settings.</span></div>';
    return '<div class="rc-c"><span class="muted">' + label + '</span> <a class="rc-val" href="' + esc(href + val) + '">' + esc(val) + '</a>' +
      '<button class="btn sm" data-act="copy" data-text="' + esc(val) + '">Copy</button></div>';
  }

  function recontactHtml(t) {
    var list = recontacts(t);
    if (!list.length) return '';
    return '<div class="panel rc-list" id="recontact"><h3>Vendors to re-contact</h3>' + list.map(function (x) {
      var vendor = x.cancel ? x.m.vendor : x.s.vendor, c = contactOf(vendor);
      var what = x.cancel ? 'Cancel ' + x.m.label + ' (was ' + E.fmt(x.m.before) + ')'
        : x.s.label + ': ' + (x.m ? E.fmt(x.m.before) + ' → ' : 'new date ') + E.fmt(x.s.start) + (x.s.time ? ', ' + E.fmtTime(x.s.time) : '');
      return '<div class="rc"><div class="rc-h"><b>' + esc(vendor || 'No vendor set') + '</b><span>' + esc(what) + '</span></div>' +
        contactLine('Phone', c.phone, 'tel:') + contactLine('Email', c.email, 'mailto:') +
        '<div class="row">' + (x.cancel ? '<button class="btn sm primary" data-act="rc-cancelled" data-mi="' + x.mi + '">✓ Cancelled with vendor</button>'
          : '<button class="btn sm primary" data-act="message" data-i="' + x.i + '">✉ Message with new date</button><button class="btn sm" data-act="status" data-v="booked" data-i="' + x.i + '">✓ Confirmed new date</button>') + '</div></div>';
    }).join('') + '</div>';
  }

  function propLabel(p) { return p.canonical_address + (p.af_account && p.af_account !== '11' ? ' (' + p.af_account + ')' : ''); }

  function loadProps() {
    if (S.props) return;
    call('apiProperties').then(function (rows) { S.props = rows; if (S.view === 'new' || S.tab === 'scope') render(); }, function (e) { toast('Could not load properties: ' + e.message, true); });
  }

  var unitLoading = {};
  function loadUnits(pid) {
    if (unitLoading[pid]) return;
    unitLoading[pid] = true;
    call('apiUnits', pid).then(function (rows) { S.units[pid] = rows; render(); }, function (e) { unitLoading[pid] = false; toast('Could not load units: ' + e.message, true); });
  }

  // Match on house number + street name only ("90 Wealthy Street SE," = "90 Wealthy St SE").
  function addrKey(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 2).join(' '); }
  function inAddrList(addr, list) { var a = addrKey(addr); return !!a && (list || []).some(function (c) { return addrKey(c) === a; }); }
  function isCookieCutter(addr) { return inAddrList(addr, S.settings.cookieCutter); }
  function isBillProperty(addr) { return inAddrList(addr, S.settings.billProperties || DEFAULT_SETTINGS.billProperties); }
  /** At Bill's properties a new / reset Tech step goes to Bill (Spencer's own vendor edits win). */
  function billTech(t) {
    if (!isBillProperty(t.property_label)) return;
    t.steps.forEach(function (s) { if (s.key === 'tech' && s.status === 'open' && !s.vendorEdited) s.vendor = 'Bill'; });
  }

  function markDirty() { S.formDirty = true; var el = $('#dirty'); if (el) el.textContent = 'Unsaved changes'; }

  function formChange(el) {
    var d = S.form; if (!d) return;
    var rerender = false;
    if (el.dataset.fp) {
      var id = el.dataset.fp, val = el.type === 'checkbox' ? el.checked : el.value;
      if (id === 'property') {
        var p = (S.props || []).filter(function (x) { return propLabel(x) === val; })[0];
        d.property = p ? { id: p.property_id, label: p.canonical_address } : { id: null, label: val };
        d.unit = null;
        if (p) d.walk_type = isBillProperty(p.canonical_address) ? WALK[1] : isCookieCutter(p.canonical_address) ? WALK[0] : WALK[2];
        rerender = true;
      } else if (id === 'unit') {
        var units = S.units[d.property && d.property.id] || [];
        var u = units.filter(function (x) { return x.unit_id === val; })[0];
        d.unit = u ? { id: u.unit_id, label: u.unit_label_af } : null;
      } else {
        d[id] = el.type === 'number' ? (val === '' ? null : Number(val)) : val;
        rerender = el.tagName === 'SELECT' || el.type === 'checkbox';
      }
    } else if (el.dataset.trade) {
      d.trades = d.trades || {};
      var tr = d.trades[el.dataset.trade] = d.trades[el.dataset.trade] || {};
      tr[el.dataset.tf] = el.value;
      rerender = el.dataset.tf === 'size';
    } else if (el.dataset.list) {
      var row = d[el.dataset.list][+el.dataset.ri];
      row[el.dataset.col] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    } else if (el.dataset.cin) {
      d.checklist = d.checklist || {};
      var croom = d.checklist[el.dataset.room] = d.checklist[el.dataset.room] || {};
      (croom[el.dataset.ii] = croom[el.dataset.ii] || {}).note = el.value;
    } else if (el.dataset.tm) {
      d.pmi_timer = d.pmi_timer || {};
      if (el.value) d.pmi_timer[el.dataset.tm] = new Date(el.value).toISOString();
      var tot = $('#pmi-total'); if (tot) tot.textContent = timerHours(d.pmi_timer);
    } else if (el.dataset.mc) {
      var mc = d.changes[+el.dataset.mc], col = el.dataset.col;
      mc[col] = col === 'hours' ? (el.value === '' ? null : Number(el.value)) : el.value;
      if (col === 'type') { mc.trade = ''; mc.size = ''; }
      if (col === 'trade') { var mcat = catBy(mc.trade); mc.size = mc.type === 'add' && mcat ? mcat.sizes[0].id : ''; }
      // Text boxes only repaint the preview: a full re-render on blur would swallow the next tap.
      if (el.tagName === 'SELECT') rerender = true; else paintImpact();
    } else if (el.dataset.nc) {
      d.nc_review = d.nc_review || {};
      d.nc_review[el.dataset.nc] = { r: el.value };
      rerender = true;
    } else return;
    markDirty();
    if (rerender) render();
  }

  function validate(key, d) {
    var miss = [];
    FORMS[key].sections.forEach(function (sec) { sec.fields.forEach(function (f) {
      if (!f.required || !showIf(f.showIf, d)) return;
      var v = d[f.id];
      if (f.type === 'property' ? !(v && v.id) : (v == null || v === '')) miss.push(f.label);
    }); });
    if (key === 'moveout') miss = !d.submitted_at || d.scope_matches ? moveOutGate(d) : []; // old submitted checks keep re-saving as before
    return miss;
  }

  /** Move-out submit gate (AC 10). Each entry says what to do. */
  function moveOutGate(d) {
    var t = cur(), out = [];
    if (!d.scope_matches) out.push('Scope check: answer "Does the scope still match the PMI?"');
    if (d.scope_matches === 'No') {
      var ch = d.changes || [];
      if (!ch.length) out.push('Scope check: add at least one change (or answer Yes)');
      ch.forEach(function (c, i) { if (!changeComplete(c)) out.push('Scope check: finish change ' + (i + 1)); });
      // Apply is NOT required (Matt, option C): an unapplied No is saved as pending_impact + banner.
    }
    var left = ncItems(t).filter(function (x) { return !((d.nc_review || {})[x.key] || {}).r; }).length;
    if (left) out.push('Not checked at the PMI: answer ' + left + ' item' + (left === 1 ? '' : 's'));
    if (!d.keys_received) out.push('Plan check: tick Keys received');
    return out;
  }

  function submitForm(final) {
    var key = S.formKey.split(':')[0], d = S.form;
    if (key === 'scope-new') key = 'scope';
    var t = S.view === 'new' ? null : cur();
    if (final) {
      var miss = validate(key, d);
      S.gate = key === 'moveout' && miss.length ? miss : null;
      if (miss.length) { toast(key === 'moveout' ? 'Not submitted: ' + miss.length + ' thing' + (miss.length === 1 ? '' : 's') + ' missing (listed above the buttons)' : 'Still needed: ' + miss.join(', '), true); if (S.gate) render(); return; }
      if ((key === 'scope' || key === 'techprep') && ownsTimer(key, d, t) && endsWalk(key, d, t) && timerRunning(d.pmi_timer)) {
        d.pmi_timer.end = new Date().toISOString();
        lsSet(timerKey(), null);
      }
    }
    if (S.view === 'new') return createTurn(d);
    var before = t.rent_ready_date, doneMsg = '', firstTechSubmit = false;
    if (key === 'scope') {
      pushUndo(t);
      t.scope = clone(d);
      t.property_id = d.property.id; t.property_label = d.property.label;
      t.unit_id = d.unit ? d.unit.id : null; t.unit_label = d.unit ? d.unit.label : null;
      t.af_wo_number = d.af_wo || null; t.move_out_date = d.move_out_date || null; t.move_in_date = d.move_in_date || null;
      t.steps = E.mergeScope(t.steps, t.scope, cat(), techHours(t));
      billTech(t);
      moveTimerToTechPrep(t);
    } else if (key === 'techprep') {
      firstTechSubmit = final && !d.submitted_at && !d.email_sent_at;
      if (final) d.submitted_at = d.submitted_at || new Date().toISOString();
      t.tech_prep = clone(d);
      var h = Number(d.tech_hours) || 0;
      var tech = t.steps.filter(function (s) { return s.key === 'tech'; })[0];
      if (final && h > 0) {
        if (!tech) {
          pushUndo(t);
          tech = E.makeStep(catBy('tech'), 'basic', '');
          insertInOrder(t, tech);
          t.scope.trades = t.scope.trades || {}; t.scope.trades.tech = { size: 'basic', note: '' };
          billTech(t);
        }
        if (!tech.hoursEdited) { E.applyTechHours(tech, h); doneMsg = 'Submitted. Tech step set to ' + h + ' hours.'; }
      }
    } else if (key === 'moveout') {
      if (final) { d.submitted_at = d.submitted_at || new Date().toISOString(); d.done_by = 'Spencer'; } // move-out is Spencer alone; the alert email reads it
      var sendAlert = false;
      if (final && unapplied(d)) { // scope changed but not applied: keep the preview as pending_impact
        var pim = impactOf(t, d.changes), prevAlert = d.pending_impact && d.pending_impact.alert_sent_at;
        d.pending_impact = { computed_at: new Date().toISOString(), rr_before: pim.rrBefore, rr_after: pim.rrAfter,
          moved: pim.diff.moved.concat(pim.diff.removed) };
        if (prevAlert) d.pending_impact.alert_sent_at = prevAlert;
        sendAlert = S.alertOn && !prevAlert;
      } else if (final) delete d.pending_impact;
      t.move_out_check = clone(d);
    }
    S.formDirty = false; S.formKey = null; S.gate = null;
    recompute(t);
    saveNow(t).then(function () {
      toast(doneMsg || (key === 'scope' ? 'Scope saved, schedule updated' : final ? 'Submitted' : 'Draft saved'));
      if (key === 'scope') { S.tab = 'schedule'; }
      render(); flashRR(before, t);
      if (firstTechSubmit) sendTechPrepEmail(t); // only the FIRST final submit sends; Resend is on purpose
      if (sendAlert) sendEmail('apiSendMoveOutAlert', t, function (r) {
        var at = r.sentAt || new Date().toISOString();
        t.move_out_check.pending_impact.alert_sent_at = at;
        if (S.form && S.formKey === 'moveout:' + t.id && S.form.pending_impact) S.form.pending_impact.alert_sent_at = at;
      });
    }, function () {});
  }

  function insertInOrder(t, step) {
    var order = cat().map(function (c) { return c.key; });
    var idx = t.steps.length;
    for (var i = 0; i < t.steps.length; i++) if (order.indexOf(t.steps[i].key) > order.indexOf(step.key)) { idx = i; break; }
    t.steps.splice(idx, 0, step);
  }

  function createTurn(d) {
    var t = {
      property_id: d.property.id, property_label: d.property.label,
      unit_id: d.unit ? d.unit.id : null, unit_label: d.unit ? d.unit.label : null,
      af_wo_number: d.af_wo || null, move_out_date: d.move_out_date, move_in_date: d.move_in_date || null,
      scope: clone(d), steps: [], stage: 'scheduling', archived: false
    };
    t.scope.submitted_at = new Date().toISOString();
    t.steps = E.stepsFromScope(t.scope, cat(), 0);
    billTech(t);
    moveTimerToTechPrep(t);
    prepTurn(t);
    var btn = $('[data-act="form-submit"]'); if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
    saveNow(t).then(function (saved) {
      var tm = pmiTimerOf(t);
      lsSet('p03timer:new', null);
      if (timerRunning(tm)) lsSet('p03timer:' + saved.id, tm.start); // Spencer-alone walk keeps running into Tech Prep
      S.turns.push(prepTurn(saved)); // same path as the boot load: lays out dates so the gantt + calendar show now
      S.formDirty = false; S.form = null; S.formKey = null;
      toast('Turn created. Here is the recommended schedule.');
      go('turn', { turnId: saved.id, tab: 'schedule' });
    }, function () { if (btn) { btn.disabled = false; btn.textContent = 'Create turn + build schedule'; } });
  }

  // ---------- Settings ----------
  var setDraft = null;
  function viewSettings() {
    if (!setDraft) setDraft = clone(S.settings);
    var vendors = {};
    setDraft.catalog.forEach(function (c) { if (c.vendor) vendors[c.vendor] = 1; c.sizes.forEach(function (z) { if (z.vendor) vendors[z.vendor] = 1; }); });
    Object.keys(DEFAULT_SETTINGS.contacts).forEach(function (v) { vendors[v] = 1; }); // includes Bill
    var h = '<div class="page-head"><h1>Settings</h1><div class="sub">Durations, vendors and the message template. Changes apply to new schedules and the Recommended button.</div></div>';
    h += '<div class="sec"><h3>Trades + durations</h3><div class="help">Business days. Hours = time on site that day. Cure = no-entry days after the step.</div>' +
      setDraft.catalog.map(function (c, ci) {
        return '<div class="set-trade"><input type="color" value="' + c.color + '" data-set="color" data-ci="' + ci + '">' +
          '<div class="fields"><label class="f half"><span>Step</span><input data-set="label" data-ci="' + ci + '" value="' + esc(c.label) + '"></label>' +
          '<label class="f half"><span>Default vendor</span><input data-set="vendor" data-ci="' + ci + '" value="' + esc(c.vendor) + '"></label></div>' +
          '<div><table class="size-t"><tr><th>Size</th><th style="width:60px">Days</th><th style="width:60px">Hours</th><th style="width:60px">Cure</th><th>Vendor (if different)</th></tr>' +
          c.sizes.map(function (z, zi) {
            function inp(k, w) { return '<td><input data-set="size-' + k + '" data-ci="' + ci + '" data-zi="' + zi + '" value="' + esc(z[k] == null ? '' : z[k]) + '"' + (w ? ' type="number" min="0" step="0.5"' : '') + '></td>'; }
            return '<tr>' + inp('label') + inp('days', 1) + inp('hours', 1) + inp('cure', 1) + inp('vendor') + '</tr>';
          }).join('') + '</table></div></div>';
      }).join('') + '</div>';
    h += '<div class="sec"><h3>Vendor contacts</h3><div class="help">Adds Text and Email buttons to the vendor message, and fills the re-contact list when a schedule changes. Grey text = the built-in default (used when the box is empty).</div><table class="list-t"><tr><th>Vendor</th><th>Phone</th><th>Email</th></tr>' +
      Object.keys(vendors).sort().map(function (v) {
        var c = setDraft.contacts[v] || {}, df = DEFAULT_SETTINGS.contacts[v] || {};
        return '<tr><td><b>' + esc(v) + '</b></td><td><input type="text" data-set="phone" data-v="' + esc(v) + '" value="' + esc(c.phone || '') + '" placeholder="' + esc(df.phone || '') + '"></td><td><input type="text" data-set="email" data-v="' + esc(v) + '" value="' + esc(c.email || '') + '" placeholder="' + esc(df.email || '') + '"></td></tr>';
      }).join('') + '</table></div>';
    h += '<div class="sec"><h3>Vendor message template</h3><div class="help">Placeholders: {vendor} {trade} {address} {unit} {date} {time} {length} {scope} {access}. A line whose placeholders are all empty is left out.</div>' +
      '<div class="fields"><label class="f"><textarea rows="7" data-set="template">' + esc(setDraft.template) + '</textarea></label></div></div>';
    h += '<div class="sec"><h3>Cookie-cutter properties</h3><div class="help">One address per line. These default to "Spencer alone" on the scope form.</div>' +
      '<div class="fields"><label class="f"><textarea rows="8" data-set="cookie">' + esc((setDraft.cookieCutter || []).join('\n')) + '</textarea></label></div></div>';
    h += '<div class="sec"><h3>Bill\'s properties</h3><div class="help">One address per line. Spencer walks these alone, Bill does the tech work (Tech step vendor = Bill, Tech Prep email goes to Bill). Checked before the cookie-cutter list.</div>' +
      '<div class="fields"><label class="f"><textarea rows="6" data-set="bill">' + esc((setDraft.billProperties || DEFAULT_SETTINGS.billProperties).join('\n')) + '</textarea></label></div></div>';
    h += '<div class="form-foot"><button class="btn primary" data-act="settings-save">Save settings</button><button class="btn ghost" data-act="settings-reset">Reset to defaults</button></div>';
    return h;
  }

  function settingsChange(el) {
    var k = el.dataset.set, ci = +el.dataset.ci, zi = +el.dataset.zi, v = el.value;
    if (k === 'color' || k === 'label' || k === 'vendor') setDraft.catalog[ci][k] = v;
    else if (k.indexOf('size-') === 0) {
      var f = k.slice(5), z = setDraft.catalog[ci].sizes[zi];
      if (f === 'label' || f === 'vendor') { if (v) z[f] = v; else delete z[f]; }
      else { if (v === '') delete z[f]; else z[f] = Number(v); }
    } else if (k === 'phone' || k === 'email') { var c = setDraft.contacts[el.dataset.v] = setDraft.contacts[el.dataset.v] || {}; c[k] = v.trim(); }
    else if (k === 'template') setDraft.template = v;
    else if (k === 'cookie') setDraft.cookieCutter = v.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    else if (k === 'bill') setDraft.billProperties = v.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) { setDraft = null; go(nav.dataset.nav); return; }
    var tab = e.target.closest('[data-tab]');
    if (tab) { if (S.formDirty && !confirm('You have unsaved form changes. Leave without saving?')) return; S.formDirty = false; S.formKey = null; S.tab = tab.dataset.tab; if (S.tab === 'scope') loadProps(); render(); return; }
    var act = e.target.closest('[data-act]');
    if (act) { handleAct(act, e); return; }
    var open = e.target.closest('[data-open]');
    if (open && open.dataset.open) { closeModal(); go('turn', { turnId: open.dataset.open, tab: 'schedule' }); }
  });

  function handleAct(el, e) {
    var a = el.dataset.act, t = cur(), i = +el.dataset.i, before = t && t.rent_ready_date;
    if (a === 'new-turn') { loadProps(); go('new'); return; }
    if (a === 'close-modal') { if (e.target === el || el.tagName === 'BUTTON') closeModal(); return; }
    if (a === 'cal-prev' || a === 'cal-next') {
      var y = +S.calMonth.slice(0, 4), m = +S.calMonth.slice(5, 7) - 1 + (a === 'cal-next' ? 1 : -1);
      var dt = new Date(y, m, 1); S.calMonth = E.iso(dt).slice(0, 7); render(); return;
    }
    if (a === 'cal-today') { S.calMonth = today().slice(0, 7); render(); return; }
    if (a === 'archive') {
      var id = el.dataset.id;
      if (!confirm('Archive this turn? It leaves the board and calendar.')) return;
      call('apiArchiveTurn', id, true).then(function () {
        S.turns = S.turns.filter(function (x) { return x.id !== id; }); toast('Archived'); go('turns');
      }, function (er) { toast(er.message, true); });
      return;
    }
    if (a === 'settings-save') {
      S.settings = mergeSettings(setDraft);
      call('apiSaveSettings', S.settings).then(function () { setDraft = null; toast('Settings saved'); render(); }, function (er) { toast(er.message, true); });
      return;
    }
    if (a === 'settings-reset') { if (confirm('Reset durations, vendors and template to the defaults?')) { setDraft = clone(DEFAULT_SETTINGS); setDraft.contacts = S.settings.contacts; render(); } return; }
    if (a === 'form-save') { submitForm(false); return; }
    if (a === 'form-submit') { submitForm(true); return; }
    if (a === 'list-add') { e.preventDefault(); var L = S.form[el.dataset.list] = S.form[el.dataset.list] || []; L.push({}); markDirty(); render(); return; }
    if (a === 'list-del') { e.preventDefault(); S.form[el.dataset.list].splice(+el.dataset.ri, 1); markDirty(); render(); return; }
    if (a === 'ci') {
      var cl = S.form.checklist = S.form.checklist || {}; var room = cl[el.dataset.room] = cl[el.dataset.room] || {};
      var it = room[el.dataset.ii] = room[el.dataset.ii] || {};
      it.s = it.s === el.dataset.v ? null : el.dataset.v;
      if (it.s !== 'fix') delete it.charge; // charge only applies to Fix lines
      markDirty(); render(); return;
    }
    if (a === 'ci-charge') {
      var crow = S.form.checklist[el.dataset.room][el.dataset.ii]; crow.charge = !crow.charge; markDirty(); render(); return;
    }
    if (a === 'ci-note') {
      var nk = el.dataset.room + ':' + el.dataset.ii; S.noteOpen[nk] = !S.noteOpen[nk]; render();
      var ni = document.querySelector('[data-fid="cin-' + el.dataset.room + '-' + el.dataset.ii + '"]'); if (ni) ni.focus();
      return;
    }
    if (a === 'timer-start') { startTimer(); return; }
    if (a === 'goto-apply') { // works from the board card too (no current turn there)
      e.stopPropagation();
      if (S.view === 'turn' && S.turnId === el.dataset.id) {
        if (S.tab !== 'moveout') { if (S.formDirty && !confirm('You have unsaved form changes. Leave without saving?')) return; S.formDirty = false; S.formKey = null; S.tab = 'moveout'; render(); }
      } else go('turn', { turnId: el.dataset.id, tab: 'moveout' });
      var ip = $('#impact'); if (ip) ip.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (a === 'copy') {
      copyText(el.dataset.text).then(function (ok) {
        if (ok) { toast('Copied ' + el.dataset.text); return; }
        var sp = el.parentNode.querySelector('.rc-val'); // fallback: select the text so a long-press copies it
        if (sp) { var rg = document.createRange(); rg.selectNodeContents(sp); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
        toast('Copy blocked. The text is selected: copy it by hand.', true);
      });
      return;
    }
    if (a === 'copy-msg') { copyText($('#msgtext').value).then(function (ok) { if (ok) toast('Copied. Paste it into a text or email.'); else { $('#msgtext').select(); toast('Press Ctrl/Cmd+C to copy', true); } }); return; }
    if (!t) return;
    if (a === 'resend-email') {
      if (S.formDirty) { toast('Save your changes first, then resend.', true); return; }
      if (confirm('Send the Tech Prep email again?')) sendTechPrepEmail(t);
      return;
    }
    if (a === 'mc-add') { e.preventDefault(); (S.form.changes = S.form.changes || []).push({ type: '', trade: '', size: '', note: '', hours: null }); markDirty(); render(); return; }
    if (a === 'mc-del') { e.preventDefault(); S.form.changes.splice(+el.dataset.ri, 1); markDirty(); render(); return; }
    if (a === 'apply-changes') { applyMoveOutChanges(); return; }
    if (a === 'mc-edit') {
      if (confirm('Undo the Apply? Every step goes back to its date and status from before Apply (anything you re-confirmed since is undone too).')) undoApply(t);
      return;
    }
    if (a === 'rc-cancelled') {
      var mm = t.move_out_check.impact.moved[+el.dataset.mi]; mm.cleared = true;
      if (S.form && S.formKey === 'moveout:' + t.id && S.form.impact) S.form.impact.moved[+el.dataset.mi].cleared = true;
      queueSave(t); render(); toast(mm.label + ' cancellation noted'); return;
    }
    if (a === 'goto-recontact') {
      if (S.tab !== 'schedule') { if (S.formDirty && !confirm('You have unsaved form changes. Leave without saving?')) return; S.formDirty = false; S.formKey = null; S.tab = 'schedule'; render(); }
      var rcl = $('#recontact'); if (rcl) rcl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (a === 'msg-booked') { pushUndo(t); t.steps[i].status = 'booked'; t.steps[i].confirmedAt = new Date().toISOString(); closeModal(); queueSave(t); render(); toast(t.steps[i].label + ' marked confirmed'); return; }
    if (a === 'message') { openMessage(t, i); return; }
    if (a === 'bar') { openBar(t, i); return; }
    if (a === 'bar-status') {
      pushUndo(t); t.steps[i].status = el.dataset.v;
      if (el.dataset.v === 'booked') t.steps[i].confirmedAt = new Date().toISOString();
      queueSave(t); render(); openBar(t, i); return;
    }
    if (a === 'bar-edit') {
      closeModal();
      var row = document.querySelector('.step[data-i="' + i + '"]');
      if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('hl'); setTimeout(function () { row.classList.remove('hl'); }, 1600); }
      return;
    }
    if (a === 'copy-all') { copyText(scheduleText(t)).then(function (ok) { toast(ok ? 'Schedule copied' : 'Copy blocked by the browser', !ok); }); return; }
    if (a === 'mark-ready') { if (!confirm('Mark this unit rent ready?')) return; t.stage = 'ready'; queueSave(t); render(); return; }
    if (a === 'unready') { t.stage = 'scheduling'; t.stage = stageOf(t); queueSave(t); render(); return; }
    if (a === 'project-status') { t.scope.project_status = el.dataset.v; queueSave(t); render(); return; }
    if (a === 'undo') {
      var snap = S.undo.pop(); if (!snap) return;
      var o = JSON.parse(snap); if (o.id !== t.id) return;
      if (o.apply) { if (confirm('Undo the move-out Apply? The whole schedule goes back to before it.')) undoApply(t); else S.undo.push(snap); return; }
      t.steps = o.steps; t.scope.trades = o.trades; queueSave(t); render(); flashRR(before, t); return;
    }
    pushUndo(t);
    if (a === 'recommended') { E.recommended(t.steps, t.move_out_date, cat()); toast('Recommended schedule laid out'); }
    else if (a === 'status') { t.steps[i].status = el.dataset.v; if (el.dataset.v === 'booked') t.steps[i].confirmedAt = new Date().toISOString(); }
    else if (a === 'unpin') t.steps[i].pinned = false;
    else if (a === 'up' && i > 0) { var tmp = t.steps[i - 1]; t.steps[i - 1] = t.steps[i]; t.steps[i] = tmp; }
    else if (a === 'down' && i < t.steps.length - 1) { var tmp2 = t.steps[i + 1]; t.steps[i + 1] = t.steps[i]; t.steps[i] = tmp2; }
    else if (a === 'remove-step') {
      var s = t.steps[i];
      if (s.status !== 'open' && !confirm(s.label + ' is ' + s.status + '. Remove it anyway? (Cancel it with the vendor yourself.)')) { S.undo.pop(); return; }
      t.steps.splice(i, 1);
      if (t.scope.trades && t.scope.trades[s.key]) t.scope.trades[s.key].size = '';
    } else if (a === 'add-step') {
      var c = catBy(el.dataset.k);
      var st = E.makeStep(c, (S.settings.defaults || {})[c.key] || c.sizes[0].id, '');
      insertInOrder(t, st); syncTrade(t, st); billTech(t);
    } else { S.undo.pop(); return; }
    queueSave(t); render(); flashRR(before, t);
  }

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.actChange === 'cal-unit') { S.calUnit = el.value; render(); return; }
    if (el.dataset.alert) { S.alertOn = el.checked; return; }
    if (el.dataset.ed) { editStep(+el.dataset.i, el.dataset.ed, el.value); return; }
    if (el.dataset.set) { settingsChange(el); return; }
    formChange(el);
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.mc && el.dataset.col === 'hours') { formChange(el); return; } // live preview while typing hours
    if (el.dataset.fp || el.dataset.list || el.dataset.cin || el.dataset.mc || el.dataset.tm || (el.dataset.trade && el.dataset.tf === 'note')) markDirty();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  // ---------- boot ----------
  function boot() {
    call('apiBoot').then(function (r) {
      S.user = r.user; S.settings = mergeSettings(r.settings);
      S.turns = (r.turns || []).map(prepTurn);
      render();
    }, function (e) {
      $('#main').innerHTML = '<div class="empty"><h2>Could not load turns</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>';
    });
  }
  window.__turnsApp = S; // for debugging in the browser console
  boot();
})();
</script>
