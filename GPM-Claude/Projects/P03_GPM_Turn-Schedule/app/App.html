<style>
/* 2026-11-09 additions (timer, per-line charge/note, move-out changes, conflicted schedule) */
.muted{color:var(--muted);font-size:13px}
.form-foot{flex-wrap:wrap}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.timer.run{border-color:var(--green-3);background:var(--green-soft)}
.timer.run b{font-size:20px;font-variant-numeric:tabular-nums}
.timer input{min-width:0}
.ci-ctl{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ci-pen,.ci-chg{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.ci-pen.on{color:var(--green);border-color:var(--green-3)}
.ci-chg.on{background:var(--gold);border-color:var(--gold);color:#fff}
.gate{background:var(--red-soft);border:1px solid #E7BFB2;color:#6E2A1C;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px}
.nc-t tr.todo td:first-child{border-left:3px solid var(--gold);padding-left:8px}
.mc{position:relative;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-left:4px solid var(--green-3);border-radius:10px;padding:10px 44px 10px 12px;margin-bottom:8px;background:#fff}
.mc.todo{border-left-color:var(--gold)}
.mc .mc-del{position:absolute;top:8px;right:8px}
.mc .f input,.mc .f select{width:100%}
.mc-done{font-weight:600;color:var(--green);margin-bottom:6px}
.imp .row,.f .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate.pend{background:#F6E7C8;border-color:#E3C98F;color:#5E4210}
.gate.pend label.cb{display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:600;cursor:pointer}
.gate.pend label.cb input{width:18px;height:18px;accent-color:var(--green)}
.imp{margin-top:10px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--cream)}
.imp-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-bottom:6px}
.imp-rr{margin-bottom:4px}
.imp .ok{color:var(--ok);font-weight:600}.imp .bad{color:var(--red);font-weight:700}
.imp-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.imp-row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.imp-row em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:var(--cream-2)}
.imp-row em.mv{background:#F6E7C8;color:#80591A}.imp-row em.new{background:var(--green-soft);color:var(--green)}.imp-row em.gone{background:var(--red-soft);color:var(--red)}
.imp-d{flex-basis:100%;padding-left:18px;font-size:13px}
.imp-row.conf{background:var(--red-soft);margin:0 -12px;padding:6px 12px}
.imp-c{flex-basis:100%;padding-left:18px;color:var(--red);font-weight:700;font-size:12px}
.imp-warn{margin-top:8px;color:var(--red);font-weight:700}
.imp-ok{margin-top:8px;color:var(--ok);font-weight:600}
.conflict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--red);color:#fff;font-weight:700;border-radius:10px;padding:9px 12px;margin-top:10px}
.conflict .btn{color:var(--red)}
.card .conflict{margin-top:0}
.rc-list{border-color:var(--red);border-width:2px}
.rc{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:5px}
.rc-h{display:flex;flex-direction:column}
.rc-h span{color:var(--red);font-weight:600;font-size:13px}
.rc-c{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.rc-c a{word-break:break-all}
.rc .row{display:flex;gap:8px;flex-wrap:wrap}
.g-bar.resched{background:var(--red)!important;color:#fff;box-shadow:0 0 0 2px var(--red-soft)}
.g-legend i.resched{background:var(--red)}
.step.resched{border-left-color:var(--red);background:var(--red-soft)}
.seg button.on.resched{background:var(--red);color:#fff}
.prog-seg.resched{background:var(--red)}
.ev.resched{background:var(--red)!important;color:#fff}
</style>
<script>
(function () {
  'use strict';
  var E = Engine;
  var S = {
    settings: null, turns: [], props: null, units: {}, user: '',
    view: 'turns', turnId: null, tab: 'schedule',
    calMonth: null, calUnit: '',
    form: null, formKey: null, formDirty: false,
    undo: [], saveTimer: null, saving: 0, saveMsg: '', saveErr: false,
    noteOpen: {}, gate: null
  };

  // ---------- utils ----------
  function esc(v) { return v == null ? '' : String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  function today() { return E.iso(new Date()); }
  function cat() { return S.settings.catalog; }
  function catBy(k) { for (var i = 0; i < cat().length; i++) if (cat()[i].key === k) return cat()[i]; return null; }
  function color(k) { var c = catBy(k); return c ? c.color : '#888'; }
  function turnById(id) { for (var i = 0; i < S.turns.length; i++) if (S.turns[i].id === id) return S.turns[i]; return null; }
  function cur() { return turnById(S.turnId); }
  function nowTime() { var d = new Date(); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  // localStorage can throw (private mode, blocked storage): the app must work without it.
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  var STATUS_LABEL = { open: 'Not booked', booked: 'Confirmed', done: 'Done', resched: 'Reschedule' };
  var WALK = FORMS.scope.sections[0].fields[2].options; // [cookie cutter, Bill's property, Riley walk]
  function spencerAlone(walkType) { return /Spencer alone/.test(walkType || ''); }
  function techName(t) {
    var tech = (t.steps || []).filter(function (s) { return s.key === 'tech'; })[0];
    return (tech && tech.vendor) || (isBillProperty(t.property_label) ? 'Bill' : 'Riley');
  }
  /** Settings contact, with DEFAULT_SETTINGS.contacts filling any blank field. */
  function contactOf(v) {
    var c = (S.settings.contacts || {})[v] || {}, d = DEFAULT_SETTINGS.contacts[v] || {};
    return { phone: c.phone || d.phone || '', email: c.email || d.email || '' };
  }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
  }

  /** Time dropdown, 6:00 AM to 9:00 PM in 10-minute steps. Keeps an off-grid saved value selectable. */
  function timeSelect(attrs, val) {
    var opts = [], has = false;
    for (var m = 6 * 60; m <= 21 * 60; m += 10) {
      var v = (m / 60 < 10 ? '0' : '') + Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60);
      if (v === val) has = true;
      opts.push('<option value="' + v + '"' + (v === val ? ' selected' : '') + '>' + E.fmtTime(v) + '</option>');
    }
    var extra = val && !has ? '<option value="' + esc(val) + '" selected>' + E.fmtTime(val) + '</option>' : '';
    return '<select ' + attrs + '><option value="">—</option>' + extra + opts.join('') + '</select>';
  }

  function toast(msg, err) {
    document.querySelectorAll('.toast').forEach(function (x) { x.remove(); });
    var t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, err ? 5000 : 2200);
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      return ok;
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  // ---------- settings ----------
  function mergeSettings(saved) {
    var s = clone(DEFAULT_SETTINGS);
    if (!saved) return s;
    Object.keys(saved).forEach(function (k) { s[k] = saved[k]; });
    if (!s.catalog || !s.catalog.length) s.catalog = clone(DEFAULT_SETTINGS.catalog);
    s.contacts = s.contacts || {};
    return s;
  }

  // ---------- turn model ----------
  function prepTurn(t) {
    t.scope = t.scope || {};
    t.steps = t.steps || [];
    recompute(t);
    return t;
  }

  function techHours(t) { return t.tech_prep && Number(t.tech_prep.tech_hours) || 0; }

  function recompute(t) {
    var r = E.layout(t.steps, t.move_out_date, cat());
    t._warnings = r.warnings;
    t._first = r.firstBuildDay;
    t.rent_ready_date = r.rentReady;
    t.stage = stageOf(t);
    return t;
  }

  function stageOf(t) {
    if (t.stage === 'ready') return 'ready';
    var pr = E.progress(t.steps);
    if (t.move_out_date && today() > t.move_out_date) return 'in_progress';
    if (pr.total && pr.booked + pr.done === pr.total) return 'booked';
    return 'scheduling';
  }
  var STAGE_LABEL = { scheduling: 'Scheduling', booked: 'All confirmed', in_progress: 'In progress', ready: 'Rent ready' };

  function payload(t) {
    var o = {};
    Object.keys(t).forEach(function (k) { if (k.charAt(0) !== '_') o[k] = t[k]; });
    return o;
  }

  function queueSave(t) {
    recompute(t);
    S.saveMsg = 'Saving…'; S.saveErr = false; paintSave();
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(function () { saveNow(t); }, 900);
  }

  function saveNow(t) {
    S.saving++;
    return call('apiSaveTurn', payload(t)).then(function (row) {
      S.saving--;
      t.updated_at = row.updated_at;
      if (!t.id) t.id = row.id;
      S.saveMsg = 'Saved ' + nowTime(); S.saveErr = false; paintSave();
      return t;
    }, function (e) {
      S.saving--;
      S.saveMsg = 'Not saved: ' + e.message; S.saveErr = true; paintSave();
      toast('Could not save. ' + e.message, true);
      throw e;
    });
  }

  function paintSave() {
    var el = $('#savestate');
    if (el) { el.textContent = S.saveMsg; el.className = 'savestate' + (S.saveErr ? ' err' : ''); }
  }

  window.addEventListener('beforeunload', function (e) {
    if (S.saving || S.saveTimer && S.saveMsg === 'Saving…' || S.formDirty) { e.preventDefault(); e.returnValue = ''; }
  });

  function pushUndo(t) {
    var snap = JSON.stringify({ id: t.id, steps: t.steps, trades: t.scope.trades });
    if (S.undo[S.undo.length - 1] === snap) return;
    S.undo.push(snap);
    if (S.undo.length > 40) S.undo.shift();
  }

  // ---------- shared bits ----------
  function unitTitle(t) { return t.unit_label ? t.unit_label : 'Whole property'; }
  function shortProp(t) { return (t.property_label || '').replace(/\s+(Grand Rapids|Wyoming|Zeeland|Grandville|Kentwood|Walker|Ada).*$/i, ''); }
  function calLabel(t) { var p = shortProp(t).replace(/\s+(St|Ave|Dr|Rd|Blvd|Ct|Pl)\b.*$/i, ''); return p + (t.unit_label ? ' ' + t.unit_label : ''); }

  function bufferHtml(t, cls) {
    var b = E.buffer(t.rent_ready_date, t.move_in_date);
    if (!t.move_in_date) return '<' + cls + ' class="buf none">No move-in date yet</' + cls + '>';
    if (!b) return '';
    if (b.ok) return '<' + cls + ' class="buf ok">✓ ' + b.days + ' business day' + (b.days === 1 ? '' : 's') + ' before move-in</' + cls + '>';
    if (b.days === 0) return '<' + cls + ' class="buf bad">Same day as move-in</' + cls + '>';
    return '<' + cls + ' class="buf bad">' + (-b.days) + ' business day' + (b.days === -1 ? '' : 's') + ' after move-in</' + cls + '>';
  }

  function progressHtml(t, big) {
    var p = E.progress(t.steps);
    var segs = t.steps.length ? t.steps.map(function (s) {
      return '<div class="prog-seg ' + s.status + '" style="--c:' + color(s.key) + '" title="' + esc(s.label + ': ' + STATUS_LABEL[s.status].toLowerCase()) + '"></div>';
    }).join('') : '<div class="prog-seg"></div>';
    return '<div class="prog' + (big ? ' big' : '') + '"><div class="prog-bar">' + segs + '</div>' +
      '<div class="prog-txt"><span>' + p.done + ' of ' + p.total + ' done · ' + p.booked + ' confirmed</span><b>' + p.pct + '%</b></div></div>';
  }

  function formChips(t) {
    function c(label, done) { return '<span class="chip' + (done ? ' done' : '') + '">' + (done ? '✓ ' : '') + label + '</span>'; }
    return '<div class="chips">' + c('Scope', true) + c('Tech prep', t.tech_prep && t.tech_prep.submitted_at) +
      c('Move-out check', t.move_out_check && t.move_out_check.submitted_at) + '</div>';
  }

  function nextAction(t) {
    if (t.stage === 'ready') return 'Rent ready';
    var rc = recontacts(t).length;
    if (rc) return 'Re-contact ' + rc + ' vendor' + (rc === 1 ? '' : 's') + ' (schedule changed at move-out)';
    for (var i = 0; i < t.steps.length; i++) if (t.steps[i].status === 'open') return 'Book ' + t.steps[i].label + (t.steps[i].vendor ? ' (' + t.steps[i].vendor + ')' : '') + ' for ' + E.fmt(t.steps[i].start);
    var td = today();
    for (var j = 0; j < t.steps.length; j++) if (t.steps[j].status !== 'done' && t.steps[j].end >= td) return 'Next on site: ' + t.steps[j].label + ', ' + E.fmt(t.steps[j].start);
    if (t.steps.length && E.progress(t.steps).done === t.steps.length) return 'All steps done. Mark rent ready.';
    return 'Everything is confirmed';
  }

  // ---------- router ----------
  function go(view, opts) {
    if (S.formDirty && !confirm('You have unsaved form changes. Leave without saving?')) return;
    S.formDirty = false; S.form = null; S.formKey = null;
    S.view = view;
    if (opts && opts.turnId !== undefined) { S.turnId = opts.turnId; S.undo = []; }
    if (opts && opts.tab) S.tab = opts.tab;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    document.querySelectorAll('#nav button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.nav === S.view || (S.view === 'turn' && b.dataset.nav === 'turns'));
    });
    var main = $('#main');
    var fid = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.fid;
    var html;
    if (S.view === 'turns') html = viewTurns();
    else if (S.view === 'calendar') html = viewCalendar();
    else if (S.view === 'settings') html = viewSettings();
    else if (S.view === 'new') html = viewNew();
    else if (S.view === 'turn') html = viewTurn();
    main.innerHTML = html;
    if (fid) { var el = main.querySelector('[data-fid="' + fid + '"]'); if (el) el.focus(); }
    paintSave();
  }

  // ---------- Turns board ----------
  function viewTurns() {
    var open = S.turns.filter(function (t) { return t.stage !== 'ready'; });
    var ready = S.turns.filter(function (t) { return t.stage === 'ready'; });
    var counts = { scheduling: 0, booked: 0, in_progress: 0, ready: ready.length };
    open.forEach(function (t) { counts[t.stage] = (counts[t.stage] || 0) + 1; });
    var h = '<div class="page-head"><h1>Turns</h1><div class="sub">' + open.length + ' open</div><div class="spacer"></div>' +
      '<button class="btn primary" data-act="new-turn">+ New turn from PMI scope</button></div>';
    if (!S.turns.length) {
      return h + '<div class="empty"><h2>No turns yet</h2><p>A turn starts when you submit the PMI Scope form.<br>The schedule is built for you right after.</p>' +
        '<button class="btn primary" data-act="new-turn">Start a PMI scope</button></div>';
    }
    h += '<div class="stats">' + ['scheduling', 'booked', 'in_progress', 'ready'].map(function (k) {
      return '<div class="stat"><span>' + STAGE_LABEL[k] + '</span><b>' + counts[k] + '</b></div>';
    }).join('') + '</div>';
    h += '<div class="grid">' + open.map(card).join('') + '</div>';
    if (ready.length) h += '<div class="section-title">Rent ready</div><div class="grid">' + ready.map(card).join('') + '</div>';
    return h;
  }

  function card(t) {
    return '<div class="card" data-open="' + t.id + '">' +
      '<div class="card-top"><div style="flex:1;min-width:0"><div class="card-unit">' + esc(unitTitle(t)) + '</div>' +
      '<div class="card-prop">' + esc(shortProp(t)) + '</div></div><span class="pill ' + t.stage + '">' + STAGE_LABEL[t.stage] + '</span></div>' +
      conflictBanner(t, false) + pendingBanner(t) +
      '<div class="rr-line"><span class="lab">Rent ready</span><span class="val">' + (t.rent_ready_date ? E.fmt(t.rent_ready_date) : '—') + '</span>' + bufferHtml(t, 'span') + '</div>' +
      '<div class="meta"><span>Move-out <b>' + (t.move_out_date ? E.fmt(t.move_out_date) : '—') + '</b></span><span>Move-in <b>' + (t.move_in_date ? E.fmt(t.move_in_date) : '—') + '</b></span></div>' +
      progressHtml(t) +
      '<div class="next">→ ' + esc(nextAction(t)) + '</div>' + formChips(t) +
      (t.stage === 'ready' ? '<div><button class="btn sm" data-act="archive" data-id="' + t.id + '">Archive</button></div>' : '') +
      '</div>';
  }

  // ---------- Turn page ----------
  function viewTurn() {
    var t = cur();
    if (!t) return '<div class="empty"><h2>Turn not found</h2><button class="btn" data-nav="turns">Back to turns</button></div>';
    var tabs = [['schedule', 'Schedule', true], ['scope', 'Scope', true],
      ['techprep', 'Tech Prep', t.tech_prep && t.tech_prep.submitted_at], ['moveout', 'Move-out check', t.move_out_check && t.move_out_check.submitted_at]];
    var head = '<div class="turn-head"><div class="th-row">' +
      '<button class="btn sm ghost" data-nav="turns">← Turns</button>' +
      '<div><h1 class="th-unit">' + esc(unitTitle(t)) + ' <span class="pill ' + t.stage + '" style="vertical-align:middle">' + STAGE_LABEL[t.stage] + '</span></h1>' +
      '<div class="th-prop">' + esc(t.property_label) + (t.af_wo_number ? ' · WO ' + esc(t.af_wo_number) : '') + (t.scope.walk_type ? ' · ' + esc(t.scope.walk_type.split(' (')[0]) : '') +
      (techHours(t) ? ' · Tech ' + techHours(t) + ' h' : '') + (pmiTimeText(t) ? ' · PMI ' + esc(pmiTimeText(t)) : '') + '</div></div>' +
      '<div class="th-dates">' +
      '<div class="kv"><span>Move-out</span><b>' + (t.move_out_date ? E.fmt(t.move_out_date) : '—') + '</b></div>' +
      '<div class="rrbox" id="rrbox"><span>Rent ready</span><b>' + (t.rent_ready_date ? E.fmt(t.rent_ready_date) : '—') + '</b>' + bufferHtml(t, 'em') + '</div>' +
      '<div class="kv"><span>Move-in</span><b>' + (t.move_in_date ? E.fmt(t.move_in_date) : '—') + '</b></div>' +
      '</div></div>' +
      '<div style="margin-top:10px">' + progressHtml(t, true) + '</div>' + conflictBanner(t, true) + pendingBanner(t) +
      '<div class="tabs">' + tabs.map(function (x) {
        return '<button data-tab="' + x[0] + '" class="' + (S.tab === x[0] ? 'on' : '') + '">' + x[1] + (x[2] ? '<span class="tick">✓</span>' : '') + '</button>';
      }).join('') + '</div></div>';
    var body;
    if (S.tab === 'schedule') body = viewSchedule(t);
    else body = viewForm(S.tab, t);
    var b = E.buffer(t.rent_ready_date, t.move_in_date);
    var flt = '<div class="rr-float' + (b && !b.ok ? ' bad' : '') + '">Rent ready <b>' + (t.rent_ready_date ? E.fmt(t.rent_ready_date) : '—') + '</b>' + bufferHtml(t, 'span') + '</div>';
    return head + body + flt;
  }

  // ---------- Schedule ----------
  function viewSchedule(t) {
    var h = '<div class="toolbar">' +
      '<button class="btn sm" data-act="recommended" title="Clear the dates you set by hand and lay out the best schedule in the standard order">↺ Recommended schedule</button>' +
      '<button class="btn sm" data-act="undo"' + (S.undo.length ? '' : ' disabled') + '>Undo</button>' +
      '<button class="btn sm" data-act="copy-all">Copy whole schedule</button>' +
      (t.stage === 'ready' ? '<button class="btn sm" data-act="unready">Reopen turn</button>'
        : '<button class="btn sm" data-act="mark-ready">Mark rent ready</button>') +
      '<button class="btn sm ghost danger" data-act="archive" data-id="' + t.id + '">Archive</button>' +
      '<span class="savestate" id="savestate"></span></div>';
    h += recontactHtml(t);
    if (t._warnings && t._warnings.length) h += '<div class="warns">' + t._warnings.map(function (w) { return '<div>⚠ ' + esc(w) + '</div>'; }).join('') + '</div>';

    // before move-out
    var sc = t.scope;
    h += '<div class="panel"><h3>Before move-out</h3><div class="pre-row">' +
      '<span>PMI: <b>' + (sc.pmi_date ? E.fmt(sc.pmi_date) + (sc.pmi_time ? ', ' + E.fmtTime(sc.pmi_time) : '') : 'not set') + '</b></span>' +
      '<span>Tech prep: <b>' + (t.tech_prep && t.tech_prep.submitted_at ? 'done (' + techHours(t) + ' h estimate)' : 'not done yet') + '</b></span>' +
      (pmiTimeText(t) ? '<span>PMI time: <b>' + esc(pmiTimeText(t)) + '</b></span>' : '') +
      (sc.project ? '<span>Project estimate (Jason): <span class="seg">' + ['open', 'done'].map(function (s) {

      var a = idx[s.start], b = idx[s.end];

  function vkey(v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

  /** Every other booking for the same vendor on the days this step covers, across all open turns. */
  function vendorDay(t, s) {
    var out = [], days = s.start ? E.bizDaysInRange(s.start, s.end) : [], k = vkey(s.vendor);
    if (!k) return out;
    days.forEach(function (d) {
      S.turns.forEach(function (o) {
        o.steps.forEach(function (x, xi) {
          if (o === t && x === s) return;
          if (vkey(x.vendor) !== k || !x.start || d < x.start || d > x.end) return;
          out.push({ day: d, turn: o, step: x });
        });
      });
    });
    out.sort(function (a, b) { return (a.day + (a.step.time || '')).localeCompare(b.day + (b.step.time || '')); });
    return out;
  }

  }

  function editStep(i, field, value) {
    var t = cur(); var s = t.steps[i]; if (!s) return;
    var before = t.rent_ready_date;
    pushUndo(t);
    if (field === 'start') { if (value) { s.start = value; s.pinned = true; } else { s.pinned = false; } }
    else if (field === 'days') s.days = Math.max(1, Math.min(20, parseInt(value, 10) || 1));
    else if (field === 'hours') { s.hours = Math.max(0.5, Number(value) || 8); s.hoursEdited = true; if (s.hours > 8 * s.days) s.days = Math.ceil(s.hours / 8); }
    else if (field === 'time') s.time = value;
    else if (field === 'vendor') { s.vendor = value; s.vendorEdited = true; }
    else if (field === 'note') { s.note = value; syncTrade(t, s); }
    else if (field === 'size') {
      var z = E.sizeOf(catBy(s.key), value);
      if (z) {
        s.size = z.id; s.sizeLabel = z.label; s.days = z.days || 1; s.hours = z.hours || 8 * (z.days || 1); s.cure = z.cure || 0;
        if (!s.vendorEdited) s.vendor = z.vendor || catBy(s.key).vendor || '';
        s.fromTechPrep = false;
        billTech(t);
      }
      syncTrade(t, s);
    }
    queueSave(t); render(); flashRR(before, t);
  }

  // ---------- Calendar ----------
  function viewCalendar() {
    if (!S.calMonth) S.calMonth = today().slice(0, 7);
    var y = +S.calMonth.slice(0, 4), m = +S.calMonth.slice(5, 7) - 1;
    var first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    var start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7)); // Monday on/before the 1st
    var end = new Date(last); end.setDate(last.getDate() + ((5 - last.getDay() + 7) % 7)); // Friday on/after the last day
    var events = {};
    function add(d, ev) { (events[d] = events[d] || []).push(ev); }
    var turns = S.turns.filter(function (t) { return !S.calUnit || t.id === S.calUnit; });
    turns.forEach(function (t) {
      var lab = calLabel(t);
      if (t.scope.pmi_date) add(E.rollBiz(t.scope.pmi_date), { cls: 'visit', text: lab + ' · PMI' + (t.scope.pmi_time ? ' ' + E.fmtTime(t.scope.pmi_time) : ''), id: t.id, c: '#1E4632' });
      if (t.move_out_date) add(E.rollBiz(t.move_out_date), { cls: 'visit', text: lab + ' · Move-out walk', id: t.id, c: '#1E4632' });
      var tech = t.steps.filter(function (s) { return s.key === 'tech'; })[0];
      t.steps.forEach(function (s) {
        if (!s.start) return;
        E.bizDaysInRange(s.start, s.end).forEach(function (d, k) {
          add(d, { cls: s.status, text: lab + ' · ' + s.label + (k === 0 && s.time ? ' ' + E.fmtTime(s.time) : '') + (s.days > 1 ? ' (' + (k + 1) + '/' + s.days + ')' : ''), id: t.id, c: color(s.key) });
        });
      });
      if (tech && tech.end) add(tech.end, { cls: 'visit', text: lab + ' · Quality check (before clean)', id: t.id, c: '#1E4632' });
      if (t.rent_ready_date) add(t.rent_ready_date, { cls: 'mark', text: '★ ' + lab + ' rent ready', id: t.id });
      if (t.move_in_date) add(E.rollBiz(t.move_in_date), { cls: 'mark', text: '⌂ ' + lab + ' move-in', id: t.id });
    });
    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var h = '<div class="cal-head"><button class="btn sm" data-act="cal-prev">‹</button><h2>' + MONTHS[m] + ' ' + y + '</h2><button class="btn sm" data-act="cal-next">›</button>' +
      '<button class="btn sm ghost" data-act="cal-today">Today</button><div class="spacer"></div>' +
      '<label class="f"><select data-act-change="cal-unit"><option value="">All turns</option>' + S.turns.map(function (t) {
        return '<option value="' + t.id + '"' + (S.calUnit === t.id ? ' selected' : '') + '>' + esc(calLabel(t)) + '</option>';
      }).join('') + '</select></label></div>';
    h += '<div class="legend">' + cat().map(function (c) { return '<span style="--c:' + c.color + '"><i></i>' + esc(c.label) + '</span>'; }).join('') +
      '<span><i style="background:#fff;border:1.5px solid #1E4632"></i>Your visits</span><span><i style="background:#fff;border:1.5px dashed #888"></i>Not booked yet</span></div>';
    h += '<div class="cal">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
    var td = today();
    for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      var key = E.iso(d), hol = E.holidayName(key);
      var cls = 'day' + (d.getMonth() !== m ? ' other' : '') + (key === td ? ' today' : '') + (hol ? ' hol' : '');
      h += '<div class="' + cls + '"><div class="day-n"><span>' + d.getDate() + '</span>' + (hol ? '<em>' + esc(hol) + '</em>' : '') + '</div>' +
        (events[key] || []).map(function (ev) {
          return '<div class="ev ' + ev.cls + '" style="--c:' + (ev.c || '#888') + '" data-open="' + ev.id + '" title="' + esc(ev.text) + '">' + esc(ev.text) + '</div>';
        }).join('') + '</div>';
    }
    return h + '</div>';
  }

  // ---------- PMI timer ----------
  // The walk timer lives on scope.pmi_timer (Riley walk: Scope submit ends it) or on tech_prep.pmi_timer
  // (Spencer alone: started on Scope or Tech Prep, Tech Prep submit ends it). A running start is also kept
  // in localStorage per turn ('new' before the turn exists) so a reload mid-walk keeps it.
  function timerKey() { return 'p03timer:' + (S.view === 'turn' && S.turnId ? S.turnId : 'new'); }
  function formKeyName() { var k = S.formKey ? S.formKey.split(':')[0] : ''; return k === 'scope-new' ? 'scope' : k; }
  function timerRunning(tm) { return !!(tm && tm.start && !tm.end); }
  /** Does this form hold the walk timer? */
  function ownsTimer(key, d, t) {
    if (key === 'scope') return !(t && spencerAlone(d.walk_type) && t.tech_prep && t.tech_prep.pmi_timer);
    return key === 'techprep' && !!t && spencerAlone(t.scope.walk_type);
  }
  function endsWalk(key, d, t) { return key === 'scope' ? !spencerAlone(d.walk_type) : key === 'techprep' && !!t && spencerAlone(t.scope.walk_type); }
  function timerHours(tm) {
    if (!tm || !tm.start || !tm.end) return '';
    return (Math.round((new Date(tm.end) - new Date(tm.start)) / 36e5 * 10) / 10) + ' h';
  }
  function pmiTimerOf(t) {
    var a = t.scope && t.scope.pmi_timer, b = t.tech_prep && t.tech_prep.pmi_timer;
    return spencerAlone(t.scope.walk_type) ? b || a : a || b;
  }
  function pmiTimeText(t) { var tm = pmiTimerOf(t); return !tm || !tm.start ? '' : tm.end ? timerHours(tm) : 'timer running'; }
  function elapsed(start) {
    var s = Math.max(0, Math.floor((Date.now() - new Date(start)) / 1000));
    var m = Math.floor(s / 60) % 60, h = Math.floor(s / 3600);
    return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }
  function localDT(iso) { if (!iso) return ''; var d = new Date(iso), p = function (n) { return (n < 10 ? '0' : '') + n; }; return E.iso(d) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  setInterval(function () { document.querySelectorAll('[data-tick]').forEach(function (el) { el.textContent = elapsed(el.dataset.tick); }); }, 1000);

  function restoreTimer(key, d, t) {
    if (!ownsTimer(key, d, t) || (d.pmi_timer && d.pmi_timer.start)) return;
    var ls = lsGet(timerKey());
    if (ls) d.pmi_timer = { start: ls };
  }

  function timerHtml(key, d, t) {
    if (key === 'scope' && !ownsTimer(key, d, t)) {
      return '<div class="timer"><b>PMI timer</b> ' + esc(pmiTimeText(t)) + '. Spencer walks alone here: the timer is on the Tech Prep tab.</div>';
    }
    if (!ownsTimer(key, d, t)) return '';
    var tm = d.pmi_timer || {};
    if (!tm.start) return '<div class="timer"><button class="btn primary" data-act="timer-start">▶ Start timer</button><span class="muted">Times the inspection. ' +
      (endsWalk(key, d, t) ? 'Submitting this form ends it.' : 'It keeps running until Tech Prep is submitted.') + '</span></div>';
    if (!tm.end) return '<div class="timer run"><b>⏱ <span data-tick="' + esc(tm.start) + '">' + elapsed(tm.start) + '</span></b><span class="muted">since ' +
      esc(new Date(tm.start).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) + '. ' +
      (endsWalk(key, d, t) ? 'Tap "Submit + end timer" when the walk is done.' : 'Keeps running until Tech Prep is submitted.') + '</span></div>';
    return '<div class="timer"><label class="f"><span>PMI start</span><input type="datetime-local" data-tm="start" data-fid="tm-start" value="' + localDT(tm.start) + '"></label>' +
      '<label class="f"><span>PMI end</span><input type="datetime-local" data-tm="end" data-fid="tm-end" value="' + localDT(tm.end) + '"></label>' +
      '<div class="f"><span>Total</span><b id="pmi-total" style="padding-top:7px">' + timerHours(tm) + '</b></div></div>';
  }

  function startTimer() {
    var d = S.form; if (!d) return;
    var key = formKeyName(), t = S.view === 'turn' ? cur() : null;
    d.pmi_timer = { start: new Date().toISOString() };
    lsSet(timerKey(), d.pmi_timer.start);
    if (t) { // also saved on the turn right away (the draft), not only on this phone
      if (key === 'scope') t.scope.pmi_timer = clone(d.pmi_timer);
      else { t.tech_prep = t.tech_prep || {}; t.tech_prep.pmi_timer = clone(d.pmi_timer); }
      queueSave(t);
    }
    markDirty(); render();
  }

  /** The walk timer belongs on Tech Prep when Spencer walks alone (data contract). */
  function moveTimerToTechPrep(t) {
    if (!spencerAlone(t.scope.walk_type) || !t.scope.pmi_timer) return;
    t.tech_prep = t.tech_prep || {};
    if (!t.tech_prep.pmi_timer) t.tech_prep.pmi_timer = t.scope.pmi_timer;
    delete t.scope.pmi_timer;
  }

  // ---------- emails (server builds + sends; the client only asks) ----------
  function sendEmail(fn, t, after) {
    toast('Sending email…');
    return call(fn, t.id).then(function (r) {
      toast('Email sent to ' + [].concat(r && r.to || []).join(', '));
      if (after) after(r || {});
      render();
    }, function (e) { toast('Email not sent: ' + e.message, true); });
  }
  function sendTechPrepEmail(t) {
    return sendEmail('apiSendTechPrepEmail', t, function (r) {
      // keep the server's stamp locally, so the next save of tech_prep does not wipe it
      t.tech_prep.email_sent_at = r.sentAt || new Date().toISOString();
      if (S.form && S.formKey === 'techprep:' + t.id) S.form.email_sent_at = t.tech_prep.email_sent_at;
    });
  }

  function showIf(cond, d) {
    if (!cond) return true;
    if (cond.indexOf('!=') > 0) { var q = cond.split('!='); return !!d[q[0]] && d[q[0]] !== q[1]; }
    var p = cond.split('=');
    return p.length > 1 ? d[p[0]] === p[1] : !!d[p[0]];
  }

  function formHtml(key, d, t, isNew) {
    var F = FORMS[key];
    var h = '<div class="form"><div class="page-head"><h1>' + esc(F.title) + '</h1></div><div class="form-who">' + esc(F.who) + '</div>';
    if (key === 'scope' || key === 'techprep') h += timerHtml(key, d, t);
    if (key === 'techprep' && t && t.move_out_check) {
      var mo = t.move_out_check;
      var added = (mo.exceptions || []).filter(function (x) { return x.type === 'New tech item'; }).map(function (x) { return x.note; })
        .concat((mo.changes || []).filter(function (x) { return x.type === 'tech' && x.note; }).map(function (x) { return x.note + (x.hours ? ' (+' + x.hours + ' h)' : ''); }));
      if (added.length) h += '<div class="panel"><h3>Added at move-out (the tech\'s list, ' + esc(techName(t)) + ')</h3>' + added.map(function (x) { return '<div>• ' + esc(x) + '</div>'; }).join('') + '</div>';
    }
    F.sections.forEach(function (sec) {
      h += '<div class="sec"><h3>' + esc(sec.title) + '</h3>' + (sec.help ? '<div class="help">' + esc(sec.help) + '</div>' : '') + '<div class="fields">';
      sec.fields.forEach(function (f) { if (showIf(f.showIf, d)) h += fieldHtml(f, d, t); });
      h += '</div></div>';
    });
    var submitted = d.submitted_at;
    var endTimer = (key === 'scope' || key === 'techprep') && ownsTimer(key, d, t) && endsWalk(key, d, t) && timerRunning(d.pmi_timer);
    if (key === 'moveout' && unapplied(d) && (d.changes || []).some(changeComplete)) {
      var pa = d.pending_impact && d.pending_impact.alert_sent_at;
      h += '<div class="gate pend">Changes are not applied to the schedule yet. You can still submit.' +
        (pa ? '<div>Alert email sent ' + esc(new Date(pa).toLocaleString()) + '.</div>'
          : '<label class="cb"><input type="checkbox" data-alert="1"' + (S.alertOn ? ' checked' : '') + '> Email an alert that the schedule isn\'t updated yet</label>') + '</div>';
    }
    if (S.gate && S.gate.length) h += '<div class="gate"><b>Before you can submit:</b>' + S.gate.map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join('') + '</div>';
    h += '<div class="form-foot">';
    if (isNew) h += '<button class="btn primary" data-act="form-submit">' + (endTimer ? 'Submit + end timer' : 'Create turn + build schedule') + '</button>';
    else if (key === 'scope') h += '<button class="btn primary" data-act="form-submit">' + (endTimer ? 'Submit + end timer' : 'Save scope + update schedule') + '</button>';
    else {
      h += '<button class="btn" data-act="form-save">Save draft</button><button class="btn primary" data-act="form-submit">' + (endTimer ? 'Submit + end timer' : submitted ? 'Save changes' : 'Submit') + '</button>';
      if (key === 'techprep' && submitted) h += '<button class="btn" data-act="resend-email">Resend email</button>';
      if (submitted) h += '<span class="muted">Submitted ' + esc(new Date(submitted).toLocaleString()) + '</span>';
      if (key === 'techprep' && d.email_sent_at) h += '<span class="muted">Email sent ' + esc(new Date(d.email_sent_at).toLocaleString()) + '</span>';
    }
    h += '<span class="dirty" id="dirty">' + (S.formDirty ? 'Unsaved changes' : '') + '</span></div></div>';
    return h;
  }

  function lab(f) { return '<span>' + esc(f.label) + (f.required ? ' <b class="req">*</b>' : '') + '</span>'; }

  function fieldHtml(f, d, t) {
    var v = d[f.id];
    var cls = 'f' + (f.half ? ' half' : '');
    var dp = 'data-fp="' + f.id + '" data-fid="ff-' + f.id + '"';
    switch (f.type) {
      case 'time':
        return '<label class="' + cls + '">' + lab(f) + timeSelect(dp, v || '') + '</label>';
      case 'text': case 'date': case 'number':
        return '<label class="' + cls + '">' + lab(f) + '<input type="' + f.type + '" ' + dp + ' value="' + esc(v == null ? '' : v) + '"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + (f.min != null ? ' min="' + f.min + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') + '>' +
          (f.help ? '<small style="color:var(--muted)">' + esc(f.help) + '</small>' : '') + '</label>';
      case 'textarea':
        return '<label class="' + cls + '">' + lab(f) + '<textarea rows="3" ' + dp + '>' + esc(v || '') + '</textarea></label>';
      case 'select':
        return '<label class="' + cls + '">' + lab(f) + '<select ' + dp + '><option value="">—</option>' + f.options.map(function (o) {
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select></label>';
      case 'checkbox':
        return '<div class="' + cls + '"><label class="cb"><input type="checkbox" ' + dp + (v ? ' checked' : '') + '>' + esc(f.label) + '</label></div>';
      case 'property':
        var plist = S.props || [];
        return '<label class="' + cls + '">' + lab(f) + '<input list="proplist" ' + dp + ' value="' + esc(v && v.label || '') + '" placeholder="' + (S.props ? 'Start typing an address' : 'Loading properties…') + '">' +
          '<datalist id="proplist">' + plist.map(function (p) { return '<option value="' + esc(propLabel(p)) + '">'; }).join('') + '</datalist></label>';
      case 'unit':
        var pid = d.property && d.property.id;
        var units = pid ? S.units[pid] : null;
        var uv = v && v.id || '';
        if (pid && !units) loadUnits(pid);
        return '<label class="' + cls + '">' + lab(f) + '<select ' + dp + '>' +
          (!pid ? '<option value="">Pick a property first</option>' : !units ? '<option value="">Loading units…</option>' :
            '<option value="">Whole property / single unit</option>' + units.map(function (u) {
              return '<option value="' + u.unit_id + '"' + (u.unit_id === uv ? ' selected' : '') + '>' + esc(u.unit_label_af || '(no label)') + '</option>';
            }).join('')) + '</select></label>';
      case 'trades':
        d.trades = d.trades || {};
        return '<div class="f">' + cat().map(function (c) {
          var tv = d.trades[c.key] || {};
          return '<div class="trade-row' + (tv.size ? '' : ' off') + '" style="--c:' + c.color + '"><span class="dot"></span><span class="tname"><b>' + esc(c.label) + '</b></span>' +
            '<select data-trade="' + c.key + '" data-tf="size" data-fid="tr-' + c.key + '"><option value="">Not needed</option>' + c.sizes.map(function (z) {
              return '<option value="' + z.id + '"' + (tv.size === z.id ? ' selected' : '') + '>' + esc(z.label) + '</option>';
            }).join('') + '</select>' +
            '<input type="text" placeholder="Note for the vendor (rooms, colors, sizes)" data-trade="' + c.key + '" data-tf="note" data-fid="tn-' + c.key + '" value="' + esc(tv.note || '') + '"></div>';
        }).join('') + '</div>';
      case 'list':
        var rows = v || [];
        return '<div class="f"><table class="list-t"><tr>' + f.columns.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '<th></th></tr>' +
          rows.map(function (r, ri) {
            return '<tr>' + f.columns.map(function (c) {
              var a = 'data-list="' + f.id + '" data-ri="' + ri + '" data-col="' + c.id + '" data-fid="l-' + f.id + '-' + ri + '-' + c.id + '"';
              if (c.type === 'checkbox') return '<td style="width:110px"><label class="cb" style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" ' + a + (r[c.id] ? ' checked' : '') + '>' + esc(c.label) + '</label></td>';
              if (c.type === 'select' || c.type === 'tradeselect') {
                var opts = c.type === 'select' ? c.options : cat().map(function (x) { return x.label; }).concat(['Other']);
                return '<td><select ' + a + '><option value="">—</option>' + opts.map(function (o) { return '<option' + (o === r[c.id] ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></td>';
              }
              return '<td' + (c.type === 'number' ? ' style="width:80px"' : '') + '><input type="' + (c.type === 'number' ? 'number' : 'text') + '" ' + a + ' value="' + esc(r[c.id] == null ? '' : r[c.id]) + '"></td>';
            }).join('') + '<td style="width:36px"><button class="iconbtn" data-act="list-del" data-list="' + f.id + '" data-ri="' + ri + '" title="Remove">✕</button></td></tr>';
          }).join('') + '</table><div><button class="btn sm" data-act="list-add" data-list="' + f.id + '">+ Add ' + esc(f.label.toLowerCase()) + '</button></div></div>';
      case 'checklist':
        return '<div class="f">' + checklistHtml(d) + '</div>';
      case 'plansummary':
        return '<div class="f">' + planSummary(t) + '</div>';
      case 'ncreview':
        return '<div class="f">' + ncReview(t, d) + '</div>';
      case 'changes':
        return '<div class="f">' + changesHtml(t, d) + '</div>';
      case 'oldexceptions': // pre-2026-11-09 free-text exceptions: read-only
        var ex = (v || []).filter(function (x) { return x.type || x.trade || x.note; });
        return ex.length ? '<div class="f"><span>Earlier exceptions (old form, read-only)</span>' + ex.map(function (x) {
          return '<div>• ' + esc([x.type, x.trade, x.note].filter(Boolean).join(' · ')) + '</div>'; }).join('') + '</div>' : '';
    }
    return '';
  }

  function roomInstances(d) {
    var out = [];
    CHECK_ROOMS.forEach(function (r) {
      if (!r.repeat) { out.push({ id: r.id, label: r.label, items: r.items }); return; }
      var n = parseInt(d[r.repeat], 10) || 0;
      for (var i = 1; i <= n; i++) out.push({ id: r.id + i, label: r.label + (n > 1 ? ' ' + i : ''), items: r.items });
    });
    return out;
  }

  function checklistHtml(d) {
    d.checklist = d.checklist || {};
    var tot = { fix: 0, nc: 0, ok: 0, na: 0 };
    var rooms = roomInstances(d).map(function (r) {
      var st = d.checklist[r.id] || {};
      var cnt = { fix: 0, nc: 0, ok: 0, na: 0 };
      var items = r.items.map(function (it, ii) {
        var e = st[ii] || {};
        if (e.s) { cnt[e.s]++; tot[e.s]++; }
        var at = ' data-room="' + r.id + '" data-ii="' + ii + '"';
        var always = e.s === 'fix' || e.s === 'nc', showNote = always || e.note || S.noteOpen[r.id + ':' + ii];
        return '<div class="ci"><span>' + esc(it) + '</span><span class="ci-ctl">' +
          (e.s === 'fix' ? '<button class="ci-chg' + (e.charge ? ' on' : '') + '" data-act="ci-charge"' + at + ' title="Tenant pays for this fix">' + (e.charge ? '✓ ' : '') + 'Charge tenant</button>' : '') +
          (!always ? '<button class="ci-pen' + (showNote ? ' on' : '') + '" data-act="ci-note"' + at + ' title="Add a note">✎</button>' : '') +
          '<span class="tri">' + [['ok', 'OK'], ['fix', 'Fix'], ['nc', 'Not checked'], ['na', 'N/A']].map(function (x) {
          return '<button class="' + (e.s === x[0] ? 'on ' + x[0] : '') + '" data-act="ci"' + at + ' data-v="' + x[0] + '">' + x[1] + '</button>';
        }).join('') + '</span></span>' +
          (showNote ? '<div class="note"><input type="text" placeholder="' + (e.s === 'fix' ? 'What to fix / part needed' : e.s === 'nc' ? 'Why not checked' : 'Note') + '" data-cin="1"' + at + ' data-fid="cin-' + r.id + '-' + ii + '" value="' + esc(e.note || '') + '"></div>' : '') + '</div>';
      }).join('');
      return '<details class="room"' + (cnt.fix || cnt.nc ? ' open' : '') + '><summary>' + esc(r.label) + '<em>' + (cnt.ok + cnt.fix + cnt.nc + cnt.na) + '/' + r.items.length + ' · ' + cnt.fix + ' fix' + (cnt.nc ? ' · ' + cnt.nc + ' not checked' : '') + '</em></summary>' + items + '</details>';
    }).join('');
    return '<div style="margin-bottom:8px;font-weight:600">' + tot.fix + ' to fix · ' + tot.nc + ' not checked · ' + tot.ok + ' OK</div>' + rooms;
  }

  function ncItems(t) {
    var out = [];
    var tp = t && t.tech_prep;
    if (!tp || !tp.checklist) return out;
    roomInstances(tp).forEach(function (r) {
      var st = tp.checklist[r.id] || {};
      r.items.forEach(function (it, ii) { if (st[ii] && st[ii].s === 'nc') out.push({ key: r.id + ':' + ii, label: r.label + ': ' + it, note: st[ii].note || '' }); });
    });
    return out;
  }

  function ncReview(t, d) {
    var items = ncItems(t);
    var tp = t && t.tech_prep, by = tp && tp.submitted_at ? '<div class="muted" style="margin-bottom:6px">Tech Prep filled by ' + esc(tp.done_by || 'the tech') + '.</div>' : '';
    if (!items.length) return '<div class="muted">' + (tp && tp.submitted_at ? by + 'Nothing was left unchecked at the PMI.' : 'Tech prep is not done yet.') + '</div>';
    d.nc_review = d.nc_review || {};
    // stored values stay the same; only the label names the tech
    var opts = [['', '— answer —'], ['Fine now', 'Fine now'], ['Add to tech list', 'Add to the tech\'s list (' + techName(t) + ')'], ['Needs vendor', 'Needs vendor'], ['Charge tenant', 'Charge tenant']];
    return by + '<table class="list-t nc-t">' + items.map(function (x) {
      var r = d.nc_review[x.key] || {};
      return '<tr' + (r.r ? '' : ' class="todo"') + '><td>' + esc(x.label) + (x.note ? '<div class="muted" style="font-size:12px">' + esc(x.note) + '</div>' : '') + '</td><td style="width:190px"><select data-nc="' + esc(x.key) + '" data-fid="nc-' + esc(x.key) + '">' +
        opts.map(function (o) { return '<option' + (o[0] === (r.r || '') ? ' selected' : '') + ' value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') + '</select></td></tr>';
    }).join('') + '</table>';
  }

  function planSummary(t) {
    if (!t) return '';
    var rows = t.steps.map(function (s) {
      return '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' + color(s.key) + '"></span> <b>' + esc(s.label) + '</b> ' + esc(s.sizeLabel || '') +
        (s.note ? '<div style="color:var(--muted);font-size:12px">' + esc(s.note) + '</div>' : '') + '</td><td>' + esc(s.vendor) + '</td><td>' + E.fmt(s.start) + '</td><td>' + STATUS_LABEL[s.status] + '</td></tr>';
    }).join('');
    var dm = (t.scope.damages || []).filter(function (x) { return x.item; });
    return '<table class="summary-t">' + rows + '</table>' +
      '<div style="margin-top:8px">Rent ready: <b>' + E.fmt(t.rent_ready_date) + '</b> · Move-in: <b>' + (t.move_in_date ? E.fmt(t.move_in_date) : '—') + '</b></div>' +
      (dm.length ? '<div style="margin-top:8px"><b>Damages at PMI:</b> ' + dm.map(function (x) { return esc(x.item) + (x.room ? ' (' + esc(x.room) + ')' : '') + (x.charge ? ' [tenant]' : ''); }).join('; ') + '</div>' : '');
  }

  // ---------- move-out scope changes (P4) ----------
  var CHANGE_TYPES = [['add', 'Add a trade'], ['resize', 'Change a size'], ['remove', 'Remove a trade'], ['tech', 'New tech item'], ['vendor', 'Other vendor item (Jason)']];
  function changeComplete(c) {
    if (c.type === 'add' || c.type === 'resize') return !!(c.trade && c.size);
    if (c.type === 'remove') return !!c.trade;
    if (c.type === 'tech' || c.type === 'vendor') return !!(c.note && String(c.note).trim());
    return false;
  }

  function changesHtml(t, d) {
    d.changes = d.changes || [];
    var applied = d.impact && d.impact.applied_at;
    if (applied) {
      return '<div class="mc-done">✓ Applied to the schedule ' + esc(new Date(applied).toLocaleString()) + '.</div>' +
        d.changes.map(function (c) { return '<div>• ' + esc(changeText(c)) + '</div>'; }).join('') + impactSummary(t, d.impact) +
        (d.pre_apply ? '<div class="row" style="margin-top:10px"><button class="btn sm" data-act="mc-edit">Edit changes</button>' +
          '<span class="muted">Puts the schedule back to before Apply, then you can change the rows and Apply again.</span></div>' : '');
    }
    var inSteps = t.steps.map(function (s) { return s.key; });
    var rows = d.changes.map(function (c, ri) {
      var a = ' data-mc="' + ri + '"', fid = function (col) { return ' data-col="' + col + '" data-fid="mc-' + ri + '-' + col + '"'; };
      function sel(col, opts, val, blank) {
        return '<select' + a + fid(col) + '><option value="">' + blank + '</option>' + opts.map(function (o) {
          return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
      }
      var h = '<label class="f"><span>Change ' + (ri + 1) + '</span>' + sel('type', CHANGE_TYPES, c.type, 'Pick a type') + '</label>';
      if (c.type === 'add' || c.type === 'resize' || c.type === 'remove') {
        var trades = cat().filter(function (x) { return c.type === 'add' ? inSteps.indexOf(x.key) < 0 || x.key === c.trade : inSteps.indexOf(x.key) >= 0; });
        h += '<label class="f"><span>Trade</span>' + sel('trade', trades.map(function (x) { return [x.key, x.label]; }), c.trade, c.type === 'add' ? 'Trade to add' : 'Trade in the scope') + '</label>';
        if (c.type !== 'remove' && catBy(c.trade)) {
          h += '<label class="f"><span>' + (c.type === 'add' ? 'Size' : 'New size') + '</span>' + sel('size', catBy(c.trade).sizes.map(function (z) { return [z.id, z.label]; }), c.size, 'Pick a size') + '</label>';
        }
