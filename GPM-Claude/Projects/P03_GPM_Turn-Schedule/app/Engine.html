<script>
/**
 * P03 Turn scheduling engine (pure JS, no DOM). Also loaded by test/engine.test.js in Node.
 *
 * Rules (TURN_PLAN.md, locked 2026-11-02 / 11-05):
 * - Build steps run in the locked order; skipped steps pull later steps forward.
 * - First build step = next business day after move-out.
 * - Business days exclude weekends + 6 vendor holidays (New Year's, Memorial, July 4, Labor, Thanksgiving, Christmas).
 * - Only Appliances + Tech may share a day (Tech starts the same day when it directly follows Appliances).
 * - A size can carry cure days (no entry) before the next step. Tub resurface: none, it sits overnight (Matt 2026-11-11).
 * - Rent ready = the last day of work. It should be at least 1 business day before move-in.
 * - A step whose date Spencer set by hand is "pinned"; later unpinned steps flow after it.
 */
var Engine = (function () {
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { if (!s) return null; var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }

  var holCache = {};
  function nthWeekday(y, m, wd, n) {
    if (n > 0) { var f = new Date(y, m, 1); return new Date(y, m, 1 + ((wd - f.getDay() + 7) % 7) + 7 * (n - 1)); }
    var l = new Date(y, m + 1, 0); return new Date(y, m, l.getDate() - ((l.getDay() - wd + 7) % 7));
  }
  // Vendor holidays (Matt 2026-11-11): the six standard business holidays, no bank-only days (MLK, Presidents',
  // Juneteenth, Columbus, Veterans). Weekend rule: Saturday -> observed Friday, Sunday -> observed Monday.
  function observed(d) { var w = d.getDay(); return w === 6 ? new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1) : w === 0 ? new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1) : d; }
  function holidays(y) {
    if (holCache[y]) return holCache[y];
    var list = [
      [new Date(y, 0, 1), "New Year's Day"], [new Date(y + 1, 0, 1), "New Year's Day"], // next Jan 1 on a Saturday = Dec 31
      [nthWeekday(y, 4, 1, -1), 'Memorial Day'], [new Date(y, 6, 4), 'Independence Day'],
      [nthWeekday(y, 8, 1, 1), 'Labor Day'], [nthWeekday(y, 10, 4, 4), 'Thanksgiving'], [new Date(y, 11, 25), 'Christmas']
    ];
    var set = {};
    list.forEach(function (h) { var o = observed(h[0]); if (o.getFullYear() === y) set[iso(o)] = h[1]; });
    holCache[y] = set;
    return set;
  }
  function holidayName(s) { var d = parse(s); return holidays(d.getFullYear())[s] || ''; }
  function isBiz(s) { var d = parse(s); var w = d.getDay(); return w !== 0 && w !== 6 && !holidays(d.getFullYear())[s]; }
  function rollBiz(s) { while (!isBiz(s)) s = addDays(s, 1); return s; }
  function nextBiz(s) { return rollBiz(addDays(s, 1)); }
  function prevBiz(s) { s = addDays(s, -1); while (!isBiz(s)) s = addDays(s, -1); return s; }
  /** n business days after s (n >= 0). addBiz(s, 0) = s rolled forward to a business day. */
  function addBiz(s, n) { s = rollBiz(s); for (var i = 0; i < n; i++) s = nextBiz(s); return s; }
  /** Business days stepping from a to b (b after a => positive). Same day = 0. */
  function bizDiff(a, b) {
    if (a === b) return 0;
    var sign = a < b ? 1 : -1, n = 0, s = a;
    if (sign > 0) { while (s < b) { s = addDays(s, 1); if (isBiz(s)) n++; } }
    else { while (s > b) { s = addDays(s, -1); if (isBiz(s)) n++; } }
    return n * sign;
  }
  function bizDaysInRange(a, b) { var out = [], s = rollBiz(a); while (s <= b) { out.push(s); s = nextBiz(s); } return out; }
  function maxIso(a, b) { return !a ? b : !b ? a : (a > b ? a : b); }

  function catalogByKey(catalog) { var m = {}; catalog.forEach(function (c) { m[c.key] = c; }); return m; }
  function sizeOf(cat, id) { if (!cat) return null; for (var i = 0; i < cat.sizes.length; i++) if (cat.sizes[i].id === id) return cat.sizes[i]; return null; }

  function makeStep(cat, sizeId, note) {
    var sz = sizeOf(cat, sizeId) || cat.sizes[0];
    return {
      key: cat.key, label: cat.label, size: sz.id, sizeLabel: sz.label,
      vendor: sz.vendor || cat.vendor || '',
      days: sz.days || 1, hours: sz.hours || 8 * (sz.days || 1), cure: sz.cure || 0,
      time: '09:00', start: null, end: null, pinned: false, status: 'open', note: note || ''
    };
  }

  /** Build the needed steps from the scope form's trade picks, in catalog (locked) order. */
  function stepsFromScope(scope, catalog, techHours) {
    var trades = (scope && scope.trades) || {};
    var out = [];
    catalog.forEach(function (cat) {
      var t = trades[cat.key];
      if (!t || !t.size) return;
      var st = makeStep(cat, t.size, t.note);
      if (cat.key === 'tech' && techHours > 0) applyTechHours(st, techHours);
      out.push(st);
    });
    return out;
  }

  function applyTechHours(step, h) {
    step.hours = Number(h);
    step.days = Math.max(1, Math.ceil(Number(h) / 8));
    step.fromTechPrep = true;
  }

  /**
   * Re-sync steps after the scope is edited: keep dates/status/vendor of steps still needed,
   * add newly needed ones in locked order, drop ones no longer needed unless already booked/done.
   */
  function mergeScope(oldSteps, scope, catalog, techHours) {
    var fresh = stepsFromScope(scope, catalog, techHours);
    var oldBy = {}; (oldSteps || []).forEach(function (s) { oldBy[s.key] = s; });
    var freshBy = {}; fresh.forEach(function (s) { freshBy[s.key] = s; });
    var kept = [];
    (oldSteps || []).forEach(function (s) {
      var f = freshBy[s.key];
      if (f) {
        if (s.status === 'open' && f.size !== s.size) {
          s.size = f.size; s.sizeLabel = f.sizeLabel; s.cure = f.cure;
          if (!s.fromTechPrep) { s.days = f.days; s.hours = f.hours; }
          if (!s.vendorEdited) s.vendor = f.vendor;
        }
        s.note = f.note;
        kept.push(s);
      } else if (s.status !== 'open') {
        s.orphan = true; kept.push(s); // booked/done but scope says not needed: keep, warn
      }
    });
    // insert new steps at their locked-order position
    var order = catalog.map(function (c) { return c.key; });
    fresh.forEach(function (f) {
      if (oldBy[f.key]) return;
      var idx = kept.length;
      for (var i = 0; i < kept.length; i++) { if (order.indexOf(kept[i].key) > order.indexOf(f.key)) { idx = i; break; } }
      kept.splice(idx, 0, f);
    });
    return kept;
  }

  /**
   * Lay out dates. Mutates and returns {steps, rentReady, firstBuildDay, warnings}.
   * steps are in Spencer's chosen order (default = locked order).
   */
  function layout(steps, moveOut, catalog, opts) {
    var reflow = opts && opts.reflow;
    var warnings = [];
    if (!moveOut) return { steps: steps, rentReady: null, firstBuildDay: null, warnings: ['Set a move-out date to build the schedule.'] };
    var first = nextBiz(moveOut);
    var cursor = first, prev = null, lastEnd = null;
    steps.forEach(function (s) {
      var earliest = cursor;
      var shares = prev && prev.key === 'appliances' && s.key === 'tech';
      if (shares) earliest = prev.start;
      var start;
      if (s.pinned && s.start) {
        start = rollBiz(s.start);
        // reflow (move-out rebuild): a pin that now clashes with the steps before it is released and moves.
        if (reflow && (start < first || (prev && start < earliest))) { s.pinned = false; start = earliest; }
        else if (start < first) warnings.push(s.label + ' is set before the first build day (' + fmt(first) + '). The tenant may still be in the unit.');
        else if (start < earliest && prev) warnings.push(s.label + ' starts before ' + prev.label + ' is finished.');
      } else {
        start = earliest;
      }
      s.days = Math.max(1, Math.round(Number(s.days) || 1));
      s.start = start;
      s.end = addBiz(start, s.days - 1);
      cursor = maxIso(cursor, addBiz(s.end, 1 + (Number(s.cure) || 0)));
      lastEnd = maxIso(lastEnd, s.end);
      prev = s;
    });
    // overlaps (only Appliances + Tech may share a day)
    for (var i = 0; i < steps.length; i++) for (var j = i + 1; j < steps.length; j++) {
      var a = steps[i], b = steps[j];
      var pair = [a.key, b.key].sort().join('+');
      if (pair === 'appliances+tech') continue;
      if (a.start <= b.end && b.start <= a.end) warnings.push(a.label + ' and ' + b.label + ' overlap (' + fmt(maxIso(a.start, b.start)) + '). Only Appliances + Tech may share a day.');
      else if (a.cure && b.start > a.end && b.start <= addBiz(a.end, a.cure)) warnings.push(b.label + ' is inside the ' + a.label + ' cure time (no entry).');
    }
    // order check vs locked order
    if (catalog) {
      var order = catalog.map(function (c) { return c.key; });
      for (var k = 1; k < steps.length; k++) {
        if (order.indexOf(steps[k].key) < order.indexOf(steps[k - 1].key)) {
          warnings.push('Order changed: ' + steps[k].label + ' now comes after ' + steps[k - 1].label + ' (standard order has it first).');
        }
      }
    }
    steps.forEach(function (s) {
      if (s.orphan) warnings.push(s.label + ' is booked but the scope no longer lists it. Cancel it with the vendor or re-add it to the scope.');
    });
    var keys = steps.map(function (s) { return s.key; });
    var tub = steps.filter(function (s) { return s.key === 'tub'; })[0];
    if (tub && tub.size === 'replace' && keys.indexOf('flooring') < 0) warnings.push('Tub is being replaced but no flooring is scheduled. A tub replacement normally means new flooring.');
    return { steps: steps, rentReady: lastEnd || first, firstBuildDay: first, warnings: warnings };
  }

  /** Fresh recommended schedule: clears pins and the order Spencer set, keeps status/vendor/notes. */
  function recommended(steps, moveOut, catalog) {
    var order = catalog.map(function (c) { return c.key; });
    steps.sort(function (a, b) { return order.indexOf(a.key) - order.indexOf(b.key); });
    steps.forEach(function (s) { s.pinned = false; });
    return layout(steps, moveOut, catalog);
  }

  /** Buffer between rent ready and move-in, in business days. ok = ready at least 1 business day before. */
  function buffer(rentReady, moveIn) {
    if (!rentReady || !moveIn) return null;
    var d = bizDiff(rentReady, moveIn);
    return { days: d, ok: d >= 1 };
  }

  /**
   * Move-out scope changes -> a NEW laid-out schedule (oldSteps is not touched).
   * changes: [{type:'add'|'resize'|'remove'|'tech'|'vendor', trade, size, note, hours}]; 'vendor' has no effect.
   * Add/resize set the trade's size (add of a trade already in the list = resize); remove drops the step;
   * tech adds hours to the Tech step (made if missing). Dates rebuild from the next business day after
   * move-out; pins that clash with the new order are released (layout reflow).
   */
  function applyChanges(oldSteps, changes, catalog, moveOut) {
    var steps = JSON.parse(JSON.stringify(oldSteps || []));
    var byKey = catalogByKey(catalog), order = catalog.map(function (c) { return c.key; });
    function find(k) { for (var i = 0; i < steps.length; i++) if (steps[i].key === k) return i; return -1; }
    function insert(st) {
      var idx = steps.length;
      for (var i = 0; i < steps.length; i++) if (order.indexOf(steps[i].key) > order.indexOf(st.key)) { idx = i; break; }
      steps.splice(idx, 0, st);
    }
    var extra = 0, techNotes = false;
    (changes || []).forEach(function (c) {
      var i = find(c.trade), cat = byKey[c.trade];
      if ((c.type === 'add' || c.type === 'resize') && cat) {
        var sz = sizeOf(cat, c.size); if (!sz) return;
        if (i < 0) { insert(makeStep(cat, sz.id, c.note)); return; }
        var s = steps[i];
        s.size = sz.id; s.sizeLabel = sz.label; s.days = sz.days || 1; s.hours = sz.hours || 8 * (sz.days || 1); s.cure = sz.cure || 0;
        s.fromTechPrep = false;
        if (!s.vendorEdited) s.vendor = sz.vendor || cat.vendor || '';
        if (c.note) s.note = c.note;
      } else if (c.type === 'remove' && i >= 0) {
        steps.splice(i, 1);
      } else if (c.type === 'tech') {
        techNotes = true; extra += Number(c.hours) || 0;
      }
    });
    if (techNotes && byKey.tech) {
      var ti = find('tech'), t;
      if (ti < 0) { t = makeStep(byKey.tech, 'basic', ''); if (extra > 0) t.hours = 0; insert(t); } else t = steps[ti];
      if (extra > 0) {
        t.hours = (Number(t.hours) || 0) + extra;
        t.days = Math.max(Number(t.days) || 1, Math.ceil(t.hours / 8));
        t.hoursEdited = true;
      }
    }
    return layout(steps, moveOut, catalog, { reflow: true });
  }

  /**
   * Compare two schedules by step key. moved = in both, start or end changed; removed = gone (after: null).
   * was_confirmed = the vendor had confirmed the old date (status booked, or already 'resched').
   */
  function diffSteps(before, after) {
    var a = {}, b = {}, moved = [], removed = [], added = [];
    (after || []).forEach(function (s) { a[s.key] = s; });
    (before || []).forEach(function (s) { b[s.key] = s; });
    (before || []).forEach(function (s) {
      var n = a[s.key], conf = s.status === 'booked' || s.status === 'resched';
      var row = { key: s.key, label: s.label, vendor: (n || s).vendor || '', before: s.start, after: n ? n.start : null,
        before_end: s.end, after_end: n ? n.end : null, was_confirmed: conf };
      if (!n) removed.push(row);
      else if (n.start !== s.start || n.end !== s.end) moved.push(row);
    });
    (after || []).forEach(function (n) { if (!b[n.key]) added.push({ key: n.key, label: n.label, vendor: n.vendor || '', after: n.start, after_end: n.end }); });
    return { moved: moved, removed: removed, added: added };
  }

  function progress(steps) {
    if (!steps || !steps.length) return { pct: 0, booked: 0, done: 0, total: 0 };
    var booked = 0, done = 0;
    steps.forEach(function (s) { if (s.status === 'done') done++; else if (s.status === 'booked') booked++; });
    var pct = Math.round(((done + booked * 0.5) / steps.length) * 100);
    return { pct: pct, booked: booked, done: done, total: steps.length };
  }

  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmt(s) { if (!s) return ''; var d = parse(s); return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); }
  function fmtTime(t) {
    if (!t) return '';
    var p = t.split(':'), h = +p[0], m = p[1] || '00';
    return (h % 12 || 12) + (m === '00' ? '' : ':' + m) + (h < 12 ? ' AM' : ' PM');
  }
  function lengthText(s) {
    if (s.days > 1) return s.days + ' business days (through ' + fmt(s.end) + ')';
    var h = Number(s.hours) || 8;
    return h >= 8 ? '1 day' : h + (h === 1 ? ' hour' : ' hours');
  }

  /** Vendor message from a template. A line whose placeholders are all empty is dropped. */
  function vendorMessage(template, ctx) {
    return template.split('\n').map(function (line) {
      var keys = line.match(/\{(\w+)\}/g) || [];
      if (keys.length && keys.every(function (k) { return !ctx[k.slice(1, -1)]; })) return null;
      return line.replace(/\{(\w+)\}/g, function (_, k) { return ctx[k] == null ? '' : ctx[k]; }).replace(/ +/g, ' ').replace(/ ([,.?])/g, '$1');
    }).filter(function (l) { return l !== null; }).join('\n').trim();
  }

  return {
    iso: iso, parse: parse, addDays: addDays, isBiz: isBiz, rollBiz: rollBiz, nextBiz: nextBiz, prevBiz: prevBiz,
    addBiz: addBiz, bizDiff: bizDiff, bizDaysInRange: bizDaysInRange, holidays: holidays, holidayName: holidayName,
    makeStep: makeStep, stepsFromScope: stepsFromScope, mergeScope: mergeScope, applyTechHours: applyTechHours,
    layout: layout, recommended: recommended, buffer: buffer, progress: progress, applyChanges: applyChanges, diffSteps: diffSteps,
    fmt: fmt, fmtTime: fmtTime, lengthText: lengthText, vendorMessage: vendorMessage, sizeOf: sizeOf, catalogByKey: catalogByKey
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;
</script>
