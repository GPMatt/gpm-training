@page { size: 11in 8.5in; margin: 0; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e8e8e4}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1c1f1a}

.sheet{
  width:11in; height:8.5in; background:#fff; overflow:hidden; position:relative;
  page-break-after:always; break-after:page;
  padding:0.5in; /* printer-safe margin — most printers can't render the outer ~0.2-0.4in */
}

/* ── Cover ─────────────────────────────────────────────── */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.cover img.logo{height:1.1in}
.cover .rule{width:5.5in;height:3px;background:#8cc63f;margin-top:4px}
.cover h1{font-size:44px;font-weight:800;letter-spacing:.02em;color:#1c1f1a}
.cover h2{font-size:20px;font-weight:400;letter-spacing:.18em;color:#555;text-transform:uppercase;margin-top:-14px}
.cover .sorted-by{font-size:12px;letter-spacing:.1em;color:#8a8e85;text-transform:uppercase;margin-top:-8px}
.cover img.qr{width:1.3in;height:1.3in;margin-top:10px}
.cover .scan-lbl{font-size:11px;letter-spacing:.12em;color:#8a8e85;text-transform:uppercase;margin-top:-14px}

/* ── Grid pages ────────────────────────────────────────── */
.grid{
  width:100%;height:100%;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);
  border-top:1px solid #d8dad3;border-left:1px solid #d8dad3;
}
.cell{
  display:flex;flex-direction:column;
  border-right:1px solid #d8dad3;border-bottom:1px solid #d8dad3;
  overflow:hidden;position:relative;
}
.cell.empty{background:#fafaf8}
.cell-head{background:#f0f1ec;padding:8px 10px 7px;border-bottom:1px solid #e4e6df;flex-shrink:0}
.cell-sku{font-size:9.5px;font-weight:700;color:#5a8a1a;letter-spacing:.04em;text-transform:uppercase}
.cell-name{font-size:11px;font-weight:600;color:#1c1f1a;line-height:1.28;margin-top:2px}
.cell-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
.cell-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.bin-tag{
  position:absolute;top:6px;right:6px;background:#5a8a1a;color:#fff;
  font-size:9px;font-weight:800;letter-spacing:.03em;border-radius:999px;
  padding:2px 8px;z-index:1;
}
</style>

  grid.className = "grid";
