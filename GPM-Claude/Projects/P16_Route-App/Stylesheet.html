<style>
  :root {
    --green:      #6abf4b;
    --green-dark: #4f9c37;
    --cream:      #f5f0e8;
    --dark:       #1a1a1a;
    --mid:        #444;
    --mid2:       #888;
    --light:      #ddd;
    --urgent:     #c0392b;
    --appt:       #b7791f;
    --appt-bg:    #fdf3e2;
    --trash:      #e0433f;
    --card:       #ffffff;
    --radius:     10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--cream);
    color: var(--dark);
    overflow: hidden; /* the app manages its own scroll regions */
  }
  a { color: var(--green-dark); text-decoration: none; }
  input[type="time"] { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #d8cfba; border-radius: 4px; }

  .app { height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ── */
  header {
    background: var(--dark); color: #fff; padding: 12px 22px;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header .title { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  header .subtitle { font-size: 12px; color: #b8b8b8; }
  header .progress-wrap { margin-top: 10px; }
  header .progress-row { display: flex; justify-content: space-between; font-size: 12px; color: #c9c9c9; margin-bottom: 5px; }
  header .progress-track { height: 7px; border-radius: 20px; background: #3a3a3a; overflow: hidden; }
  header .progress-fill { height: 100%; background: var(--green); border-radius: 20px; transition: width .3s ease; }

  /* ── Build My Day: dual panel ── */
  .day-body { flex: 1; display: flex; min-height: 0; }
  .pool-panel {
    width: 400px; flex-shrink: 0; background: #fbf9f5; border-right: 1.5px solid #e4dcca;
    display: flex; flex-direction: column; padding: 16px 16px 12px;
  }
  .pool-header-label { font-size: 13px; font-weight: 700; color: var(--mid2); text-transform: uppercase; letter-spacing: .5px; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .filter-chip {
    padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 700;
    background: #fff; color: var(--mid); border: 1.5px solid var(--light); cursor: pointer; user-select: none;
  }
  .filter-chip.active { background: var(--green); color: #fff; border-color: var(--green); }
  .sort-row { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--mid2); margin-top: 8px; cursor: pointer; user-select: none; }
  .pool-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; margin-top: 12px; padding-bottom: 8px; }

  .pool-card {
    background: var(--card); border-radius: var(--radius); border: 1.5px solid var(--light);
    padding: 10px 10px 10px 12px; cursor: grab;
  }
  .pool-card.used { background: #f1efe9; border-color: #e4dcca; opacity: .6; cursor: default; }
  .pool-card-row { display: flex; align-items: center; gap: 9px; }
  .pool-card-addr { font-size: 13.5px; font-weight: 700; }
  .pool-card-meta { font-size: 11.5px; color: var(--mid2); margin-top: 1px; }
  .pool-card-meta .urgent-txt { color: var(--urgent); font-weight: 700; }
  .grip { flex-shrink: 0; color: var(--mid2); }
  .schedule-toggle { flex-shrink: 0; color: var(--appt); cursor: pointer; }
  .schedule-editor {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e6cf9e;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .schedule-editor input[type="time"] { font-size: 12px; padding: 3px 5px; border: 1.5px solid #e6cf9e; border-radius: 6px; }
  .schedule-editor .lbl { font-size: 11.5px; font-weight: 700; color: var(--appt); }

  /* ── My Day (right) panel ── */
  .myday-panel { flex: 1; padding: 16px 22px 14px; display: flex; flex-direction: column; min-width: 0; }
  .myday-title { font-size: 13px; font-weight: 700; color: var(--mid2); text-transform: uppercase; letter-spacing: .5px; }
  .myday-sub { font-size: 11.5px; color: var(--mid2); margin-top: 2px; }
  .myday-scroll { flex: 1; overflow-y: auto; margin-top: 10px; padding-bottom: 8px; }

  .section-label { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .section-label.urgent { color: var(--urgent); }
  .section-label.mid { color: var(--mid); }
  .section-label.appt { color: var(--appt); }

  .dropzone {
    border: 1.5px dashed var(--light); border-radius: var(--radius); padding: 8px;
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-height: 44px;
  }
  .dropzone.urgent-zone { border-color: #e0b3ac; }
  .dropzone-empty { font-size: 12px; color: var(--mid2); text-align: center; padding: 6px 0; }

  .rank-card {
    background: var(--card); border-radius: 8px; border: 1.5px solid var(--light);
    padding: 9px 8px 9px 10px; display: flex; align-items: center; gap: 9px; cursor: grab;
  }
  .rank-badge {
    width: 20px; height: 20px; border-radius: 50%; background: var(--urgent); color: #fff;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .bucket-item {
    background: #f2f2f2; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: grab;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .bucket-item .remove-x { color: var(--mid2); cursor: pointer; flex-shrink: 0; }

  .scheduled-card {
    background: var(--appt-bg); border-radius: var(--radius); border: 1.5px solid #e6cf9e;
    padding: 10px 12px; margin-bottom: 14px;
  }
  .scheduled-card .addr { font-size: 13.5px; font-weight: 700; }
  .scheduled-card .desc { font-size: 11.5px; color: var(--mid); margin-top: 1px; }
  .scheduled-card .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .scheduled-card .window { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--appt); }
  .btn-confirm-sched { padding: 6px 14px; border-radius: 8px; background: var(--appt); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
  .btn-confirm-sched.confirmed { background: var(--green); }

  .myday-footer { flex-shrink: 0; padding-top: 10px; }
  .myday-warning { font-size: 12px; color: var(--appt); font-weight: 700; margin-bottom: 8px; min-height: 16px; }
  .btn-build {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 13px; border-radius: var(--radius); background: var(--green); color: #fff;
    font-size: 15px; font-weight: 700; border: none; cursor: pointer;
  }
  .btn-build:disabled { background: #cfe4c3; color: #6b8a5f; cursor: default; }

  /* ── Review & Go ── */
  .review-body { flex: 1; display: flex; min-height: 0; }
  .route-col { flex: 1; padding: 18px 24px; overflow-y: auto; display: flex; justify-content: center; }
  .route-list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 8px; }

  .stop-swipe-wrap { position: relative; border-radius: var(--radius); overflow: hidden; }
  .stop-trash-bg {
    position: absolute; inset: 0; background: var(--trash);
    display: flex; align-items: center; padding-left: 16px; cursor: pointer;
  }
  .stop-card {
    background: var(--card); border: 1.5px solid var(--light); border-radius: var(--radius);
    padding: 11px 8px 11px 14px; display: flex; align-items: center; gap: 10px;
    position: relative; touch-action: pan-y;
  }
  .stop-card.complete { background: #eef3ea; border-color: #d9e3d2; opacity: .75; }
  .stop-card.scheduled { background: var(--appt-bg); border-color: #e6cf9e; }
  .stop-check {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--light);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .stop-check.done { background: var(--green); border-color: var(--green); }
  .stop-card.scheduled .stop-check { border-color: #d8b463; }
  .stop-addr { font-size: 14px; font-weight: 700; }
  .stop-card.complete .stop-addr { text-decoration: line-through; color: var(--mid2); }
  .stop-desc { font-size: 11.5px; color: var(--mid); }
  .stop-card.complete .stop-desc { color: var(--mid2); }
  .stop-window { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: var(--appt); }
  .stop-detail-toggle {
    display: flex; align-items: center; gap: 4px; margin-top: 5px;
    font-size: 11px; font-weight: 700; color: var(--mid2); cursor: pointer; user-select: none; width: fit-content;
  }
  .stop-detail-toggle .chev { transition: transform .15s ease; }
  .stop-detail-toggle.open .chev { transform: rotate(90deg); }
  .stop-details {
    margin-top: 6px; padding-top: 7px; border-top: 1px dashed var(--light);
    display: flex; flex-direction: column; gap: 4px;
  }
  .stop-detail-row { display: flex; gap: 10px; font-size: 12px; }
  .stop-detail-row .k { font-weight: 700; color: var(--mid2); text-transform: uppercase; letter-spacing: .3px; font-size: 10.5px; flex-shrink: 0; padding-top: 1px; }
  .stop-detail-row .v { color: var(--mid); }
  .stop-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
  .btn-directions {
    display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 8px;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 700; border: none; cursor: pointer; white-space: nowrap;
  }
  .stop-grip { color: var(--mid2); cursor: grab; }

  .divider-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .divider-row .line { flex: 1; height: 1px; background: var(--light); }
  .divider-row .lbl { font-size: 11px; font-weight: 700; color: var(--mid2); text-transform: uppercase; letter-spacing: .4px; }

  .add-wo-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    padding: 11px; border-radius: var(--radius); border: 1.5px dashed var(--light); background: transparent;
    color: var(--mid); font-size: 13.5px; font-weight: 700; margin-top: 2px; cursor: pointer;
  }

  .summary-rail { width: 250px; flex-shrink: 0; background: #fbf9f5; border-left: 1.5px solid #e4dcca; padding: 20px 18px; }
  .summary-rail .rail-title { font-size: 12px; font-weight: 700; color: var(--mid2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
  .rail-stat-big { font-size: 20px; font-weight: 800; }
  .rail-stat-label { font-size: 11px; color: var(--mid2); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .rail-warning { background: #fdf3e2; border: 1.5px solid #e6cf9e; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--appt); margin-top: 12px; }

  /* ── Shared ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--dark); color: #fff; padding: 12px 20px; border-radius: 30px;
    font-size: 14px; font-weight: 600; transition: transform .3s ease; z-index: 200; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .sortable-ghost { opacity: .35; }
  .sortable-chosen { box-shadow: 0 8px 16px rgba(0,0,0,.15); }

  [hidden] { display: none !important; }
</style>
